/* ===== js/30-store.js ===== */
/* ===================== STORAGE: profiles, progress, copies =====================
   Everything lives on the device (localStorage). Several apps share the site maksimmartynov2000-spec.github.io,
   so every key starts with «brevet:».
     brevet:profiles     — [{ id, name, pin: { s, h } | null, at }]   who studies on this device
     brevet:db:<id>      — the whole progress of one student (saved after every answer)
     brevet:snap:<id>    — up to 3 earlier copies of it: one per day and one before every restore
     brevet:theme        — light / dark / auto for the device
   Nothing is ever deleted silently: a restore or a transfer first keeps the current progress as a copy. */
const APP = {
  id: 'brevet', title: 'Brevet',
  exam: '2027-06-28', examLabel: 'понедельник, 28 июня 2027, 10:00–12:00',
  tableur: 'https://maksimmartynov2000-spec.github.io/Knights/'
};
const DBV = 1;                     /* version of the progress format; bump it together with migrate() */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('brevet:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('brevet:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('brevet:' + k); } catch (e) { /* no storage */ } }
};
const SS = {
  get(k) { try { return sessionStorage.getItem('brevet:' + k); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) sessionStorage.removeItem('brevet:' + k); else sessionStorage.setItem('brevet:' + k, v); } catch (e) { /* no storage */ } }
};

let DB = null;                     /* progress of the student who is signed in */
const profiles = () => LS.get('profiles', []);
const saveProfiles = ps => LS.set('profiles', ps);
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function newDb(name) {
  return {
    v: DBV, id: newId(), name, created: Date.now(), saved: 0,
    sk: {},            /* topic id → { a: first tries, c: right at the first try, s: right in a row, m: mastered, t: last time, d: from the start test } */
    pb: {},            /* problem id → { n: times done, best: 0…1, last: 0…1, t } */
    days: {},          /* 'YYYY-MM-DD' → answers that day */
    log: {},           /* 'YYYY-MM-DD' → { n, ok } */
    goal: 0, goalH: {},
    exams: [], cur: null, diag: null,
    badges: {}, bk: { at: 0, n: 0 },
    ru: false, kbd: false, vib: true, pinAsk: true
  };
}
/* older progress files are brought up to the current format here (nothing yet: version 1 is the first) */
function migrate(db) {
  if (!db.v) db.v = 1;
  ['sk', 'pb', 'days', 'log', 'goalH', 'badges'].forEach(k => { if (!db[k] || typeof db[k] !== 'object' || Array.isArray(db[k])) db[k] = {}; });
  if (!Array.isArray(db.exams)) db.exams = [];
  if (!db.bk) db.bk = { at: 0, n: 0 };
  return db;
}

/* ---------- saving ---------- */
let SAVE_FAIL = false, saveT = 0;
function save() {
  if (!DB) return true;
  clearTimeout(saveT); saveT = 0;
  const day = ymd(new Date());
  if (DB.snapDay !== day) { snapshot('день ' + dateRu(DB.snapDay || day)); DB.snapDay = day; }
  DB.saved = Date.now();
  let ok = LS.set('db:' + DB.id, DB);
  if (!ok) { trimSnaps(DB.id, 1); ok = LS.set('db:' + DB.id, DB); }
  if (!ok) { trimSnaps(DB.id, 0); ok = LS.set('db:' + DB.id, DB); }
  if (ok !== !SAVE_FAIL) { SAVE_FAIL = !ok; if (typeof syncWarn === 'function') syncWarn(); }
  return ok;
}
/* typing in a test: save a moment later, and for sure when the app is hidden */
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 500); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveT) save(); });
window.addEventListener('pagehide', () => { if (saveT) save(); });

/* ---------- copies of the progress kept on the device ---------- */
const snaps = id => LS.get('snap:' + id, []);
function snapshot(why) {
  if (!DB || !DB.saved) return;
  const prev = LS.get('db:' + DB.id, null); if (!prev) return;
  const list = snaps(DB.id); list.unshift({ at: Date.now(), why, db: prev });
  while (list.length > 3) list.pop();
  if (!LS.set('snap:' + DB.id, list)) trimSnaps(DB.id, 1);
}
function trimSnaps(id, keep) { const l = snaps(id).slice(0, keep); if (keep) LS.set('snap:' + id, l); else LS.del('snap:' + id); }

/* ---------- profiles and PIN ---------- */
async function pinHash(pin, salt) {
  const txt = 'brevet|' + salt + '|' + pin;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 2166136261; for (const c of txt) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return 'f' + (h >>> 0).toString(16); }
}
async function pinMake(pin) { const s = Math.random().toString(36).slice(2, 10); return { s, h: await pinHash(pin, s) }; }
async function pinOk(prof, pin) { return !prof.pin || (await pinHash(pin, prof.pin.s)) === prof.pin.h; }
const normName = s => String(s || '').trim().replace(/\s+/g, ' ').slice(0, 30);

function openProfile(id) {
  const raw = LS.get('db:' + id, null);
  DB = migrate(raw || newDb((profiles().find(p => p.id === id) || {}).name || 'Ученик'));
  DB.id = id;
  const ps = profiles(); const p = ps.find(x => x.id === id); if (p) { p.at = Date.now(); p.name = DB.name; saveProfiles(ps); }
  LS.set('last', id); SS.set('in', id);
  if (!raw) save();
  askPersist();
  return DB;
}
async function createProfile(name, pin) {
  const db = newDb(normName(name));
  const ps = profiles(); ps.push({ id: db.id, name: db.name, pin: pin ? await pinMake(pin) : null, at: Date.now() }); saveProfiles(ps);
  LS.set('db:' + db.id, db);
  return openProfile(db.id);
}
function signOut() { if (DB) save(); DB = null; SS.set('in', null); }
const profOf = id => profiles().find(p => p.id === id);
async function setPin(pin) {
  const ps = profiles(); const p = ps.find(x => x.id === DB.id); if (!p) return;
  p.pin = pin ? await pinMake(pin) : null; saveProfiles(ps);
}
function renameProfile(name) {
  DB.name = normName(name) || DB.name; save();
  const ps = profiles(); const p = ps.find(x => x.id === DB.id); if (p) { p.name = DB.name; saveProfiles(ps); }
}

/* ---------- the browser may clean the storage of a site: ask it not to ---------- */
function askPersist() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(v => v || navigator.storage.persist()).then(v => LS.set('persist', !!v)).catch(() => {}); } catch (e) { /* not supported */ }
}
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ---------- progress as a file or as a code ---------- */
function backupData() { return { app: APP.id, kind: 'progress', v: DBV, at: Date.now(), db: DB }; }
/* strict check of what comes from outside: only known fields of known shapes */
function sanitizeDb(d) {
  if (!d || typeof d !== 'object') return null;
  const num = (x, lo, hi) => (typeof x === 'number' && isFinite(x) && x >= lo && x <= hi ? x : 0);
  const out = newDb(normName(d.name) || 'Ученик'); out.id = DB ? DB.id : out.id; out.created = num(d.created, 0, 4e12) || Date.now();
  const okId = k => /^[a-z0-9.\-_]{1,60}$/i.test(k);
  const okDay = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
  if (d.sk && typeof d.sk === 'object') for (const k in d.sk) { const s = d.sk[k]; if (okId(k) && s && typeof s === 'object') out.sk[k] = { a: num(s.a, 0, 1e6), c: num(s.c, 0, 1e6), s: num(s.s, 0, 1e6), m: s.m ? 1 : 0, t: num(s.t, 0, 4e12), d: s.d ? 1 : 0 }; }
  if (d.pb && typeof d.pb === 'object') for (const k in d.pb) { const s = d.pb[k]; if (okId(k) && s && typeof s === 'object') out.pb[k] = { n: num(s.n, 0, 1e6), best: num(s.best, 0, 1), last: num(s.last, 0, 1), t: num(s.t, 0, 4e12) }; }
  if (d.days && typeof d.days === 'object') for (const k in d.days) if (okDay(k)) out.days[k] = num(d.days[k], 0, 1e5);
  if (d.log && typeof d.log === 'object') for (const k in d.log) { const s = d.log[k]; if (okDay(k) && s && typeof s === 'object') out.log[k] = { n: num(s.n, 0, 1e5), ok: num(s.ok, 0, 1e5) }; }
  if (d.goalH && typeof d.goalH === 'object') for (const k in d.goalH) if (okDay(k)) out.goalH[k] = num(d.goalH[k], 0, 500);
  if (d.badges && typeof d.badges === 'object') for (const k in d.badges) if (okId(k)) out.badges[k] = num(d.badges[k], 0, 4e12);
  if (Array.isArray(d.exams)) out.exams = d.exams.slice(-30).filter(e => e && typeof e === 'object').map(e => ({ mode: String(e.mode || '').slice(0, 12), t0: num(e.t0, 0, 4e12), t1: num(e.t1, 0, 4e12), p1: num(e.p1, 0, 6), p2: num(e.p2, 0, 12), note: num(e.note, 0, 20), max: num(e.max, 0, 20), n: num(e.n, 0, 500), ok: num(e.ok, 0, 500), weak: Array.isArray(e.weak) ? e.weak.filter(okId).slice(0, 12) : [] }));
  if (d.diag && typeof d.diag === 'object') out.diag = { at: num(d.diag.at, 0, 4e12), n: num(d.diag.n, 0, 100), ok: num(d.diag.ok, 0, 100) };
  out.goal = num(d.goal, 0, 200); out.ru = !!d.ru; out.tipTr = d.tipTr ? 1 : 0; out.kbd = !!d.kbd; out.vib = d.vib !== false; out.pinAsk = d.pinAsk !== false;
  if (d.bk && typeof d.bk === 'object') out.bk = { at: num(d.bk.at, 0, 4e12), n: num(d.bk.n, 0, 1e7) };
  return out;
}
/* two copies of one student's progress → the best of both (nothing done is lost) */
function mergeDb(a, b) {
  const o = JSON.parse(JSON.stringify(a));
  for (const k in b.sk) { const x = o.sk[k], y = b.sk[k]; o.sk[k] = !x ? y : { a: Math.max(x.a, y.a), c: Math.max(x.c, y.c), s: Math.max(x.s, y.s), m: x.m || y.m ? 1 : 0, t: Math.max(x.t, y.t), d: x.d && y.d ? 1 : 0 }; }
  for (const k in b.pb) { const x = o.pb[k], y = b.pb[k]; o.pb[k] = !x ? y : { n: Math.max(x.n, y.n), best: Math.max(x.best, y.best), last: x.t >= y.t ? x.last : y.last, t: Math.max(x.t, y.t) }; }
  for (const k in b.days) o.days[k] = Math.max(o.days[k] || 0, b.days[k]);
  for (const k in b.log) { const x = o.log[k] || { n: 0, ok: 0 }, y = b.log[k]; o.log[k] = { n: Math.max(x.n, y.n), ok: Math.max(x.ok, y.ok) }; }
  for (const k in b.badges) o.badges[k] = o.badges[k] ? Math.min(o.badges[k], b.badges[k]) : b.badges[k];
  const seen = new Set(o.exams.map(e => e.t0 + '|' + e.mode)); b.exams.forEach(e => { if (!seen.has(e.t0 + '|' + e.mode)) o.exams.push(e); });

/* ===== js/70-exam.js ===== */
/* ===================== MOCK EXAMS and the START TEST =====================
   p1     Partie 1 — Automatismes: 9 short questions, 20 min, no calculator, 6 points
   p2     Partie 2 — 4 problems, 1 h 40, calculator, 12 points checked by the app (+2 for the write-up, marked by a teacher)
   blanc  both parts like on the day: Partie 1 is handed in after 20 minutes, then Partie 2
   quick  6 short questions, 10 minutes — for a busy day
   diag   start test: 2 questions per chapter, no timer; a right answer marks the topic as known, so the plan skips it
   A test is stored as seeds, so after closing the app it comes back with exactly the same questions. */
const MODES = {
  p1: { ru: 'Partie 1 · автоматизмы', fr: 'Automatismes', sub: '9 вопросов · 20 минут · без калькулятора', ic: 'nocalc' },
  p2: { ru: 'Partie 2 · задачи', fr: 'Raisonnement et résolution de problèmes', sub: '4 задачи · 1 ч 40 · с калькулятором', ic: 'calc' },
  blanc: { ru: 'Brevet blanc', fr: 'Épreuve complète', sub: 'обе части · 2 часа, как на экзамене', ic: 'exam' },
  quick: { ru: 'Экспресс', fr: 'Entraînement rapide', sub: '6 вопросов · 10 минут', ic: 'timer' },
  diag: { ru: 'Стартовая проверка', fr: 'Test de positionnement', sub: '2 вопроса по каждой главе · без таймера', ic: 'list' }
};
const P1_PLAN = ['nc', 'nc', 'pp', 'cl', 'fn', 'st', 'gm', 'ge', 'ge|cl|st|al'];
const rnd = () => Math.floor(Math.random() * 1e9);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function pickShort(n, plan, filter) {
  const used = new Set(), out = [];
  const pool = TOPICS.filter(filter);
  const take = chs => { const c = shuffle(pool.filter(t => chs.includes(t.ch) && !used.has(t.id))); return c.find(t => !isM(t.id)) || c[0]; };
  (plan || []).slice(0, n).forEach(slot => { const t = take(slot.split('|')); if (t) { used.add(t.id); out.push(t); } });
  while (out.length < n) { const t = shuffle(pool.filter(x => !used.has(x.id)))[0]; if (!t) break; used.add(t.id); out.push(t); }
  return out.map(t => ({ tid: t.id, vi: Math.floor(Math.random() * t.variants), seed: rnd() }));
}
function pickProblems(n) {
  const byCh = {}; shuffle(PROBLEMS).forEach(p => { (byCh[p.ch] = byCh[p.ch] || []).push(p); });
  const order = shuffle(Object.keys(byCh)); const out = [];
  for (let round = 0; out.length < n && round < 10; round++) order.forEach(ch => { if (out.length >= n) return; const l = byCh[ch].sort((a, b) => ((DB.pb[a.id] || {}).n || 0) - ((DB.pb[b.id] || {}).n || 0)); if (l[round]) out.push(l[round]); });
  return out.map(p => ({ pid: p.id, seed: rnd() }));
}
function newExam(mode) {
  const now = Date.now(), parts = [];
  const short = t => t.lvl <= 2 && !t.calc;
  if (mode === 'p1' || mode === 'blanc') parts.push({ kind: 'short', title: 'Partie 1 — Automatismes', pts: 6, dur: 20 * 60, items: pickShort(9, P1_PLAN, short) });
  if (mode === 'quick') parts.push({ kind: 'short', title: 'Экспресс', pts: 6, dur: 10 * 60, items: pickShort(6, shuffle(P1_PLAN).slice(0, 6), short) });
  if (mode === 'diag') {
    const items = []; CHAPTERS.forEach(c => { [1, 2].forEach(l => { const ts = shuffle(TOPICS.filter(t => t.ch === c.id && t.lvl === l)); if (ts[0]) items.push({ tid: ts[0].id, vi: Math.floor(Math.random() * ts[0].variants), seed: rnd() }); }); });
    parts.push({ kind: 'short', title: 'Стартовая проверка', pts: 0, dur: 0, items });
  }
  if (mode === 'p2' || mode === 'blanc') parts.push({ kind: 'prob', title: 'Partie 2 — Raisonnement et résolution de problèmes', pts: 12, dur: 100 * 60, probs: pickProblems(4) });
  DB.cur = { mode, t0: now, part: 0, parts, vals: {} };
  startPart(); save();
}
function startPart() { const pt = DB.cur.parts[DB.cur.part]; pt.start = Date.now(); if (pt.dur) pt.end = pt.start + pt.dur * 1000; }

/* questions of a part, rebuilt from the seeds */
const EXC = new Map();
function partItems(pi, cur) {
  cur = cur || DB.cur; const key = cur.t0 + ':' + pi; if (EXC.has(key)) return EXC.get(key);
  const pt = cur.parts[pi]; let out = [];
  if (pt.kind === 'short') out = pt.items.map(x => { const t = TP(x.tid); if (!t) return null; try { return { t, it: t.gen(mkRng(x.seed), x.vi % t.variants) }; } catch (e) { return null; } }).filter(Boolean);
  else out = pt.probs.map(x => { const p = PB(x.pid); if (!p) return null; try { return { pb: p, p: p.gen(mkRng(x.seed)) }; } catch (e) { return null; } }).filter(Boolean);
  EXC.clear(); EXC.set(key, out); return out;
}
const fid = (pi, qi, i, k) => 'x' + pi + '_' + qi + '_' + (k == null ? '' : k + '_') + i;

/* ---------- timer ---------- */
let TIMER = 0;
function stopTimer() { clearInterval(TIMER); TIMER = 0; }
function tick() {
  const cur = DB.cur; if (!cur) return stopTimer();
  const pt = cur.parts[cur.part]; const el = $('#tmr'); if (!pt.end) return;
  const left = (pt.end - Date.now()) / 1000;
  if (el) { el.textContent = mmss(left); el.classList.toggle('low', left < 120); }
  if (left <= 0) { stopTimer(); toast('Время вышло — работа собрана'); handIn(true); }
}

/* ---------- the test on screen ---------- */
function viewExamRun() {

  const pi = cur.part, pt = cur.parts[pi], md = MODES[cur.mode];
  if (pt.end && Date.now() >= pt.end) return handIn(true);
  chrome({ title: md.ru, back: '#/exam', tr: true, kb: true });
  const items = partItems(pi);

function answeredCount() {
  const cur = DB.cur, pi = cur.part, pt = cur.parts[pi]; let n = 0, a = 0;
  partItems(pi).forEach((x, k) => {
    const qs = pt.kind === 'short' ? [x.it] : x.p.qs;
    qs.forEach((q, qi) => { n++; const fs = fieldsOf(q.ans); if (fs.every((f, i) => { const v = cur.vals[pt.kind === 'short' ? fid(pi, k, i) : fid(pi, qi, i, k)]; return v != null && v !== ''; })) a++; });
  });

}
const progressText = () => { const [a, n] = answeredCount(); return 'Отвечено ' + a + ' из ' + n; };
window.appBusy = () => !!(DB && DB.cur && /^#\/exam\/run/.test(location.hash));

/* ---------- hand in a part; after the last part — the result ---------- */
function handIn(timeUp) {
  const cur = DB.cur; if (!cur) return;
  stopTimer();
  const pt = cur.parts[cur.part]; pt.done = Date.now(); pt.timeUp = !!timeUp;
  if (cur.part < cur.parts.length - 1) { cur.part++; startPart(); save(); EXC.clear(); hideKb(); route(); window.scrollTo(0, 0); return; }
  finishExam();
}
function scoreExam(cur, apply) {
  const res = { parts: [], weak: new Set(), n: 0, ok: 0 };
  cur.parts.forEach((pt, pi) => {
    const items = partItems(pi, cur); const R = { kind: pt.kind, title: pt.title, pts: pt.pts, qs: [] };
    if (pt.kind === 'short') {
      items.forEach((x, qi) => { const ok = fieldsOf(x.it.ans).every((f, i) => gradeField(f.spec, cur.vals[fid(pi, qi, i)]).ok); R.qs.push({ ok, tid: x.t.id }); res.n++; if (ok) res.ok++; else res.weak.add(x.t.id); });
      R.score = items.length ? pt.pts * R.qs.filter(q => q.ok).length / items.length : 0;
    } else {
      let got = 0, tot = 0;
      items.forEach((x, k) => {
        const wsum = x.p.qs.reduce((s, q) => s + (q.pts || 1), 0); let g = 0;
        x.p.qs.forEach((q, qi) => { const ok = fieldsOf(q.ans).every((f, i) => gradeField(f.spec, cur.vals[fid(pi, qi, i, k)]).ok); R.qs.push({ ok, pid: x.pb.id }); res.n++; if (ok) { res.ok++; g += q.pts || 1; } });
        got += x.pb.pts * g / wsum; tot += x.pb.pts;
        const f = g / wsum;
        if (apply) { const st = DB.pb[x.pb.id] = Object.assign({ n: 0, best: 0, last: 0, t: 0 }, DB.pb[x.pb.id]); st.n++; st.best = Math.max(st.best, f); st.last = f; st.t = Date.now(); }
        if (f < 0.6) res.weak.add(x.pb.id);
      });
      R.score = tot ? pt.pts * got / tot : 0;
    }
    res.parts.push(R);
  });
  return res;
}
function finishExam() {
  const cur = DB.cur; const res = scoreExam(cur, true);
  const p1 = res.parts.filter(p => p.kind === 'short').reduce((s, p) => s + p.score, 0), p2 = res.parts.filter(p => p.kind === 'prob').reduce((s, p) => s + p.score, 0);
  if (cur.mode === 'diag') {
    partItems(0, cur).forEach((x, qi) => {
      const ok = res.parts[0].qs[qi].ok; const s = DB.sk[x.t.id] = Object.assign({ a: 0, c: 0, s: 0, m: 0, t: 0, r: '' }, DB.sk[x.t.id]);
      s.a++; s.t = Date.now(); s.r = ((s.r || '') + (ok ? '1' : '0')).slice(-8);
      if (ok) { s.c++; s.m = 1; s.d = 1; if (x.t.lvl === 2) TOPICS.filter(t => t.ch === x.t.ch && t.lvl === 1 && !DB.sk[t.id]).forEach(t => { DB.sk[t.id] = { a: 0, c: 0, s: 0, m: 1, t: Date.now(), r: '', d: 1 }; }); }
      const k = todayKey(); DB.days[k] = (DB.days[k] || 0) + 1; const lg = DB.log[k] = DB.log[k] || { n: 0, ok: 0 }; lg.n++; if (ok) lg.ok++;
    });
    DB.diag = { at: Date.now(), n: res.n, ok: res.ok }; DB.plan = null;
  }
  const max = cur.mode === 'blanc' ? 18 : cur.mode === 'p2' ? 12 : 6;
  const rec = { mode: cur.mode, t0: cur.t0, t1: Date.now(), p1: Math.round(p1 * 10) / 10, p2: Math.round(p2 * 10) / 10, note: Math.round((p1 + p2) * 10) / 10, max, n: res.n, ok: res.ok, weak: [...res.weak].slice(0, 12) };
  DB.last = { rec, cur };            /* the last test with the answers — for the review screen */
  DB.exams.push(rec); DB.exams = DB.exams.slice(-30); DB.cur = null; save(); EXC.clear(); checkBadges();
  go('#/exam/res');
}

function reviewQ(it, num, vals) {
  const fs = fieldsOf(it.ans); const marks = fs.map((f, i) => gradeField(f.spec, vals[i]).ok);

  let h = '<section class="card q exq rvq ' + (ok ? 'okq' : 'badq') + '">' + qHtml(it, num);
  h += '<div class="ansbox' + (fs.length > 1 ? ' multi' : '') + '">' + fs.map((f, i) => '<div class="part ' + (marks[i] ? 'ok' : 'bad') + '">' + fieldHtml(f, 'rv' + String(num).replace('.', '_') + '_' + i, vals[i], { mark: marks[i] ? 'ok' : 'bad', reveal: true, lock: true }) + '</div>').join('') + '</div>';
  h += '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b class="t">' + (ok ? 'Верно' : vals.every(v => v == null || v === '') ? 'Нет ответа' : 'Неверно') + '</b>' + (ok ? '' : '<span>Ответ: ' + answerHtml(it.ans) + '</span>') + '</div>';

    '<div class="lst"><div class="lrow"><span class="lic">' + ico(per ? 'shield' : 'help') + '</span><span class="lt"><b>' + (per ? 'Браузер не будет очищать память приложения' : per === false ? 'Браузер может очистить память при нехватке места' : 'Защита памяти: проверяется') + '</b><span class="muted">' + (isStandalone() ? 'Открыто с экрана «Домой» — хорошо.' : isIOS() ? 'Открыто в Safari: лучше добавить на экран «Домой».' : 'Открыто в браузере.') + '</span></span></div>' +
    '<div class="lrow"><span class="lic">' + ico('save') + '</span><span class="lt"><b>Последняя копия файлом</b><span class="muted">' + (DB.bk.at ? new Date(DB.bk.at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : 'ещё не было') + '</span></span></div></div></section>';
  h += '<section class="card"><h3>Сохранить копию</h3><p class="muted">Файл можно положить в «Файлы» (iCloud Drive) или отправить Максиму Николаевичу в мессенджере. Раз в неделю приложение напомнит.</p><div class="row"><button class="btn primary" id="dSave">' + ico('save') + 'Сохранить копию</button><button class="btn" id="dCode">' + ico('share') + 'Код для переноса</button></div></section>';
  h += '<section class="card"><h3>Загрузить копию</h3><p class="muted">С другого устройства или из старой копии. Сначала покажу, что изменится; текущий прогресс не потеряется — он объединится с копией.</p><div class="row"><label class="btn" for="dFile">' + ico('load') + 'Из файла</label><input type="file" id="dFile" accept=".json,application/json" hidden><button class="btn" id="dPaste">Вставить код</button></div></section>';
  if (sn.length) h += '<section class="card"><h3>Копии на этом устройстве</h3><p class="muted">Делаются сами: одна в день и перед каждой загрузкой. Можно вернуть прогресс к такому состоянию — текущий тоже сохранится копией.</p><div class="lst">' + sn.map((s, i) => '<button class="lrow" data-snap="' + i + '"><span class="lic">' + ico('redo') + '</span><span class="lt"><b>' + new Date(s.at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + '</b><span class="muted">' + esc(s.why || '') + ' · заданий: ' + dbSummary(s.db).tasks + '</span></span></button>').join('') + '</div></section>';
  shell(h);
  $('#dSave').onclick = exportFile;
  $('#dCode').onclick = async () => {
    const code = await progressCode();
    const sh = openSheet('<h3>Код для переноса</h3><p class="muted">Скопируй и вставь на новом устройстве: «Перенести прогресс» на экране входа или «Вставить код» здесь. В коде весь прогресс (' + code.length + ' знаков).</p><textarea class="inp plain code" rows="4" readonly>' + esc(code) + '</textarea><div class="row"><button class="btn primary" id="cCopy">Скопировать</button>' + (navigator.share ? '<button class="btn" id="cShare">Поделиться</button>' : '') + '</div>');
    $('#cCopy', sh).onclick = () => copyText(code);
    if ($('#cShare', sh)) $('#cShare', sh).onclick = () => navigator.share({ text: code }).catch(() => {});
  };
  $('#dPaste').onclick = moveInSheet;
  $('#dFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { previewRestore(readBackup(JSON.parse(rd.result))); } catch (er) { toast(er.message || 'Это не файл прогресса'); } }; rd.readAsText(f); };
  $$('[data-snap]').forEach(b => b.onclick = () => {
    const s = sn[+b.dataset.snap];
    confirmSheet('Вернуть это состояние?', 'Прогресс станет таким, каким был ' + new Date(s.at).toLocaleString('ru-RU') + '. Текущее состояние сохранится копией — его тоже можно будет вернуть.', 'Вернуть', () => {
      snapshot('перед возвратом'); const keep = { id: DB.id, name: DB.name, snapDay: DB.snapDay }; DB = Object.assign(migrate(JSON.parse(JSON.stringify(s.db))), keep); save(); toast('Готово'); go('#/');
    });
  });
}
function copyText(t) {
  const done = () => toast('Скопировано');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); else fallbackCopy(t, done);
}
function fallbackCopy(t, cb) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); cb(); } catch (e) { /* not supported */ } a.remove(); }

/* ---------- cheat sheets and the dictionary ---------- */
function viewFiche(ch) {
  const c = CH(ch); if (!c) return go('#/prog');
  chrome({ title: 'Шпаргалка', back: '#/ch/' + ch, tab: 1 });
  const fs = FICHES.filter(f => f.ch === ch);
  shell('<section class="card theory"><span class="chnum">' + esc(c.ru) + '</span>' + fs.map((f, i) => '<details' + (i === 0 ? ' open' : '') + '><summary>' + esc(f.ru) + ' <span class="frn" lang="fr">' + esc(f.fr) + '</span></summary>' + (f.body || []).map(p => '<p>' + rt(p) + '</p>').join('') + (f.ex && f.ex.length ? '<div class="ex">' + f.ex.map(e => '<div><span class="muted">' + rt(e[0]) + '</span>' + (e[1] ? '<div class="mth">' + K(mi(e[1])) + '</div>' : '') + '</div>').join('') + '</div>' : '') + '</details>').join('') + '</section>');
}
const glossKey = s => s.toLowerCase().replace(/^(le |la |les |l'|l’|un |une |des )/, '').normalize('NFD').replace(/[̀-ͯ]/g, '');
function viewDico() {
  chrome({ title: 'Словарик', back: '#/prog', tab: 1 });
  const list = GLOSS.slice().sort((a, b) => glossKey(a.fr).localeCompare(glossKey(b.fr)));
  shell('<section class="card"><input class="inp plain" id="dq" type="search" placeholder="Поиск: médiane, медиана…" autocomplete="off" inputmode="search"></section><div class="card dico" id="dl"></div>');
  const draw = q => { q = (q || '').trim().toLowerCase(); const k = glossKey(q); const xs = list.filter(g => !q || glossKey(g.fr).includes(k) || g.ru.toLowerCase().includes(q)); $('#dl').innerHTML = xs.length ? xs.map(g => '<div class="dw"><b lang="fr">' + esc(g.fr) + '</b><span>' + esc(g.ru) + '</span>' + (g.note ? '<small class="muted">' + rt(g.note) + '</small>' : '') + '</div>').join('') : '<p class="muted">Ничего не нашлось</p>'; };
  draw(''); $('#dq').addEventListener('input', e => draw(e.target.value));
}

  h += '<section class="card"><h3>Android (Chrome)</h3><ol class="gsteps"><li>Меню ⋮ справа вверху.</li><li>«Добавить на главный экран» → «Установить».</li></ol></section>';

const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1F3558"/><text x="32" y="45" text-anchor="middle" font-family="Lora B, Georgia, serif" font-weight="600" font-size="38" fill="#FBFAF7">B</text><circle cx="49" cy="46" r="4.5" fill="#E3A94B"/></svg>';

/* ===== js/95-boot.js ===== */
/* ===================== SELF-UPDATE (from the pages-template) =====================
   At the top of index.html there is <meta name="app-build">, set by tools/stamp.py.
   On opening, on coming back to the app and every 10 minutes the app downloads the first 4 KB of the fresh
   index.html and compares the marks. A new build: if the student is not busy — reload at once,
   if busy (typing, a test is running, see window.appBusy) — a bar «Обновить». */
const BUILD = (document.querySelector('meta[name="app-build"]') || {}).content || '';
const UPD_ON = !!BUILD && BUILD !== 'dev' && /^https?:$/.test(location.protocol);
const UPD_KEY = 'brevet:upd';
let updNew = null, updAt = 0, updBusy = false, updGoing = false;
window.appBusy = window.appBusy || (() => false);
function isBusy() {
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select') || a.isContentEditable)) return true;
  if ($('#sheet')) return true;
  try { return !!window.appBusy(); } catch (e) { return false; }
}
const updGet = () => { try { return JSON.parse(sessionStorage.getItem(UPD_KEY) || 'null'); } catch (e) { return null; } };
const updPut = v => { try { if (v) sessionStorage.setItem(UPD_KEY, JSON.stringify(v)); else sessionStorage.removeItem(UPD_KEY); } catch (e) { /* no storage */ } };
async function updCheck(force) {
  if (!UPD_ON || updBusy || updGoing || (!force && Date.now() - updAt < 60000) || navigator.onLine === false) return null;
  updBusy = true; updAt = Date.now();
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = setTimeout(() => ctl && ctl.abort(), 9000);
  let found = null;
  try {
    /* ?upd=time — to get past the caches of the browser, of GitHub Pages and of the offline copy */
    const r = await fetch(location.pathname + '?upd=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=0-4095' }, signal: ctl ? ctl.signal : undefined });
    let txt = '';
    if (r.body && r.body.getReader && typeof TextDecoder === 'function') {
      const rd = r.body.getReader(), dec = new TextDecoder();
      while (txt.length < 16384) { const x = await rd.read(); if (x.done) break; txt += dec.decode(x.value, { stream: true }); if (/name="app-build" content="[^"]*"/.test(txt)) break; }
      try { rd.cancel(); } catch (e) { /* closed */ }
    } else txt = (await r.text()).slice(0, 16384);
    const m = (r.ok || r.status === 206) && txt.match(/name="app-build" content="([^"]+)"/);
    if (m && m[1] !== BUILD && m[1] !== 'dev') { found = updNew = m[1]; updTick(); }
  } catch (e) { /* offline — next time */ }
  clearTimeout(tm); updBusy = false;
  return found;
}
function updTick() {
  if (!updNew || updGoing) return;
  const tried = updGet();
  const looping = tried && tried.to === updNew && tried.n >= 2 && Date.now() - tried.at < 600000;
  if (isBusy() || looping) updBar(true); else updGo();
}
function updGo() {
  if (!updNew || updGoing) return;
  updGoing = true; if (DB) save();
  const tried = updGet();
  updPut({ to: updNew, at: Date.now(), n: tried && tried.to === updNew ? (tried.n || 0) + 1 : 1 });
  toast('Обновляю приложение…', 2000);
  setTimeout(() => location.replace(location.pathname + '?v=' + encodeURIComponent(updNew) + location.hash), 600);
}
function updBar(on) {
  let el = document.getElementById('updbar');
  if (!on) { if (el) el.remove(); return; }
  if (el) return;
  el = document.createElement('div'); el.id = 'updbar'; el.setAttribute('role', 'status');
  el.innerHTML = '<span><b>Вышла новая версия</b><small>Ответы сохранены, обновление займёт пару секунд</small></span><button type="button" class="btn primary" data-upd="go">Обновить</button><button type="button" class="x" data-upd="x" aria-label="Позже">✕</button>';
  el.addEventListener('click', e => { const b = e.target.closest('[data-upd]'); if (!b) return; if (b.dataset.upd === 'go') updGo(); else { el.remove(); updNew = null; } });
  document.body.appendChild(el);
}

/* ---------- offline: sw.js keeps a copy of the page ---------- */
function swStart() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').catch(() => { /* works online without it */ });
}

/* ===================== START ===================== */
function autoSignIn() {
  const inId = SS.get('in'); if (inId && profOf(inId)) return openProfile(inId);
  const ps = profiles(); const p = profOf(LS.get('last', '')) || (ps.length === 1 ? ps[0] : null);
  if (!p) return null;
  const ask = p.pin && (LS.get('db:' + p.id, {}) || {}).pinAsk !== false;
  return ask ? null : openProfile(p.id);
}
function boot() {
  applyTheme();
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  $('#abBack').onclick = goBack;
  $('#tTr').onclick = () => { setTr(!(DB && DB.ru)); vib(8); };
  $('#tKb').onclick = () => { if (!DB) return; DB.kbd = !DB.kbd; save(); chrome(VIEW); $$('input.inp[data-field]').forEach(i => { i.inputMode = DB.kbd ? 'text' : 'none'; }); hideKb(); toast(DB.kbd ? 'Обычная клавиатура' : 'Математическая клавиатура'); };
  $('#tabbar').innerHTML = TABS.map(([h, ic, t]) => '<button type="button" class="tab">' + ico(ic) + '<span>' + t + '</span></button>').join('');
  $$('.tab').forEach((t, i) => t.onclick = () => go(TABS[i][0]));
  addEventListener('scroll', () => $('#appbar').classList.toggle('sc', scrollY > 4), { passive: true });
  if (autoSignIn()) setTr(DB.ru);
  route();
  const sp = $('#splash'); if (sp) { sp.classList.add('out'); setTimeout(() => sp.remove(), 400); }
  if (UPD_ON) {
    const was = updGet();
    if (was && was.to === BUILD) { updPut(null); setTimeout(() => toast('Приложение обновлено'), 500); }
    if (/[?&]v=/.test(location.search) && history.replaceState) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* fine */ } }
    setTimeout(() => updCheck(true), 1500);
    setInterval(() => { if (document.visibilityState === 'visible') updCheck(); }, 600000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') updCheck(true); });
    addEventListener('pageshow', e => { if (e.persisted) updCheck(true); });
    addEventListener('online', () => updCheck(true));
  }
  swStart();
  window.__t1 = performance.now();
}
boot();

/* for the automatic checks (tools/check.js, tests/) */
window.__upd = { get build() { return BUILD; }, get on() { return UPD_ON; }, get found() { return updNew; }, check: () => updCheck(true), busy: isBusy };
window.__brevet = { TOPICS, PROBLEMS, CHAPTERS, get DB() { return DB; }, go, route, newExam, handIn, record, mkRng, grade, keyInput, gradeField,
  quiet() { QUIET = true; CELE.length = 0; $$('.cele').forEach(e => e.remove()); } };
</script>
