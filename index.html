/* ===================== Marta · Maths — a quiet study notebook: warm paper, ink blue, one amber accent ===================== */
:root{
  --paper:#F5F3EE; --card:#FFFFFF; --ink:#1C2330; --muted:#5A6272; --faint:#7B8290;
  --accent:#1F3558; --accent-ink:#27457A; --accent-soft:#E9EEF6;
  --line:#E4E0D8; --grid:#ECE8E0; --chip:#F2EFE9;
  --ok:#2F7D57; --ok-soft:#E4F1EA; --bad:#B4443C; --bad-soft:#F9E7E4; --warn:#855A0E; --warn-soft:#FBF1DC; --amber:#E3A94B;
  --c2:#A8741A; --on-accent:#FBFAF7;
  --focus-bg:#1F3558; --focus-ink:#FBFAF7; --focus-sub:rgba(251,250,247,.78); --focus-line:rgba(251,250,247,.2); --focus-btn:#FBFAF7; --focus-btn-ink:#1F3558;
  --veil:rgba(28,35,48,.42);
  --shadow:none; --shadow-up:0 10px 30px rgba(28,35,48,.14);
  --f-display:"Lora B",Georgia,"Times New Roman",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --kb-h:0px;
  --tab-h:calc(58px + env(safe-area-inset-bottom));--sc:var(--accent-ink);--scs:var(--accent-soft)
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12151A; --card:#1A1E25; --ink:#E8EAED; --muted:#A3AAB6; --faint:#7E8693;
  --accent:#8FB0E8; --accent-ink:#8FB0E8; --accent-soft:#1E2A40;
  --line:#2A303A; --grid:#242A33; --chip:#222730;
  --ok:#6FCB9B; --ok-soft:#17302A; --bad:#F09A90; --bad-soft:#3A2220; --warn:#E9BC6C; --warn-soft:#352A14; --amber:#E3A94B;
  --c2:#E9BC6C; --on-accent:#101722;
  --focus-bg:#1B2740; --focus-ink:#EEF1F6; --focus-sub:rgba(238,241,246,.74); --focus-line:rgba(238,241,246,.16); --focus-btn:#8FB0E8; --focus-btn-ink:#101722;
  --veil:rgba(0,0,0,.6); --shadow-up:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151A; --card:#1A1E25; --ink:#E8EAED; --muted:#A3AAB6; --faint:#7E8693;
  --accent:#8FB0E8; --accent-ink:#8FB0E8; --accent-soft:#1E2A40;
  --line:#2A303A; --grid:#242A33; --chip:#222730;
  --ok:#6FCB9B; --ok-soft:#17302A; --bad:#F09A90; --bad-soft:#3A2220; --warn:#E9BC6C; --warn-soft:#352A14; --amber:#E3A94B;
  --c2:#E9BC6C; --on-accent:#101722;
  --focus-bg:#1B2740; --focus-ink:#EEF1F6; --focus-sub:rgba(238,241,246,.74); --focus-line:rgba(238,241,246,.16); --focus-btn:#8FB0E8; --focus-btn-ink:#101722;
  --veil:rgba(0,0,0,.6); --shadow-up:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
html.kbon{--tab-h:0px}

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
b,strong{font-weight:600}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.ru{color:var(--muted);font-size:.9em}
.katex{font-size:1.08em}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:block}

/* ---------- page and shell ---------- */
.page{max-width:980px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-left)) calc(28px + var(--kb-h) + var(--tab-h)) max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:12px}
html.isroot .page{max-width:720px}
@media (min-width:960px) and (orientation:landscape){.page{max-width:1240px}}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;min-height:56px;padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left));background:var(--paper);border-bottom:1px solid transparent;transition:border-color .2s}
.appbar.sc{border-bottom-color:var(--line)}
.ab-back{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--accent-ink);margin-left:-4px;margin-right:6px;cursor:pointer;flex:0 0 auto}
.ab-back .ico{width:22px;height:22px;stroke-width:2}
.ab-back:active{background:var(--accent-soft)}
.ab-title{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.isroot .ab-title{font-family:var(--f-display);font-weight:600;font-size:25px;letter-spacing:-.005em}
.tools{display:flex;gap:8px;align-items:center}
.appbar .tools{gap:6px;flex:0 0 auto}

/* bottom bar: flat, attached to the edge */

/* ---------- type ---------- */

details>summary{cursor:pointer}
details.syn summary{cursor:pointer;color:var(--accent-ink);font-weight:600}

/* ---------- cards, rows, buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card>p.muted{font-size:15.5px;line-height:1.45;margin:8px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px 16px;min-height:46px;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink);padding-inline:8px}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px;border-radius:9px}
.btn.wide{width:100%}

.btn:disabled,.btn[disabled]{opacity:.45;cursor:default}
.btn.round{width:46px;height:46px;padding:0;border-radius:10px;flex:0 0 auto}
.btn.round .ico{width:20px;height:20px}
.btn.big{min-height:54px;font-size:18px;border-radius:12px}
.btn.big .ico{width:18px;height:18px;fill:currentColor;stroke:none}
.btn.big.wide .ico{fill:none;stroke:currentColor}
.btn.wide .ico{width:20px;height:20px}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.primary{color:var(--on-accent)}
label.btn{display:inline-flex;align-items:center}
.btn:focus-visible,.tgl:focus-visible,.opt:focus-visible,.k:focus-visible,.skill:focus-visible,.chcard:focus-visible,.lrow:focus-visible,.scrow:focus-visible,.tab:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
#bCheck,#bSelf{flex:1 1 100%}
@media (min-width:700px){#bCheck,#bSelf{flex:0 0 auto;min-width:200px}}
#stSave{flex:0 0 auto;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:13px;font-weight:600}
.pill.g{background:var(--ok-soft);color:var(--ok)} .pill.y{background:var(--warn-soft);color:var(--warn)} .pill.r{background:var(--bad-soft);color:var(--bad)} .pill.b{background:var(--accent-soft);color:var(--accent-ink)}
b.ext{display:inline-block;font-size:10.5px;font-weight:600;line-height:1;padding:3px 6px;border-radius:5px;background:var(--warn-soft);color:var(--warn);letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.bar{height:6px;background:var(--grid);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--kb-h) + var(--tab-h));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15.5px;font-weight:500;max-width:calc(100% - 32px);z-index:40;box-shadow:var(--shadow-up)}

/* ---------- chapter / topic lists ---------- */
.chcard{cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;width:100%}
.chnum{font-size:12px;color:var(--accent-ink);font-weight:600;letter-spacing:.09em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.chtitle{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.25}

.sechead{display:flex;align-items:baseline;gap:10px;margin:14px 2px 2px;padding-bottom:6px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.3}
.sechead:first-child{margin-top:2px}

.skills{display:flex;flex-direction:column;gap:8px}
.skill{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.skill.ext{border-style:dashed;background:transparent}
.skill .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.skill .id{font-size:12px;font-weight:600;color:var(--accent-ink);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.skill .ru{font-size:14px;color:var(--muted)}
.skill .ru,.qhead .ru,.chhead .ru,.tbl .ru{font-size:.85em}
.dots{display:flex;gap:4px;flex:0 0 auto;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}

.dots b{font-size:13px;color:var(--ok);margin-left:4px}
.lst{display:flex;flex-direction:column;gap:8px}

.lrow .ok{color:var(--ok)}.lrow .ok .ico{width:22px;height:22px;stroke-width:2.2}
.prow.card{border-radius:14px}
.prow.flat{border:0;padding:6px 0;min-height:0;background:none}
.prt{display:flex;justify-content:space-between;gap:10px;font-size:16px}

.lic.big .ico{width:24px;height:24px}
.duo{display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}.lst2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- notes ---------- */
.theory p{margin:6px 0}
.theory .ex{background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;display:flex;flex-direction:column;gap:9px}

.inp::placeholder{color:var(--faint);font-weight:400}

.opt.on{border-color:var(--accent-ink);background:var(--accent-soft)}

.unitrow{display:flex;align-items:center;gap:8px}

.uchips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 0 2px;scrollbar-width:none}

/* ---------- drawings and tables ---------- */

.gr .bn{font-size:12.5px;fill:var(--ink)}
.sol .svgw{margin:6px 0 2px}
.newtip{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 11px;margin:0 0 10px;font-size:14.5px;line-height:1.4}.newtip svg{flex:0 0 auto;width:18px;height:18px;margin-top:1px;color:var(--accent-ink)}
.rcp{border:1px solid var(--line);border-radius:10px;padding:8px 12px;line-height:1.55;max-width:300px}.rcp b{font-family:var(--f-display)}

/* ---------- practice tests ---------- */
.examcard{background:var(--card)}
.exq{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.exq:first-child{border-top:0;padding-top:0}
.exnum{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:6px;background:var(--accent-soft);font-size:13.5px;font-weight:600;color:var(--accent-ink);margin-right:8px;font-variant-numeric:tabular-nums;vertical-align:1px}
.subs{display:flex;flex-direction:column;gap:12px}
.sub{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;align-items:start}
.sub>.lt{font-weight:600;color:var(--muted);padding-top:6px}
.sub .mark{font-size:14px;font-weight:600}
.sub .mark.ok{color:var(--ok)} .sub .mark.bad{color:var(--bad)} .sub .mark.self{color:var(--warn)}
.chhead{font-family:var(--f-display);font-weight:600;font-size:18px;margin:10px 0 0;padding:0 2px 6px;border-bottom:1px solid var(--line);color:var(--ink)}
.sticky{position:sticky;bottom:calc(8px + var(--kb-h) + var(--tab-h));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--accent-ink);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow-up)}
.score{font-family:var(--f-display);font-weight:600;font-size:42px;line-height:1;font-variant-numeric:lining-nums}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice label{border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;background:var(--card);font-size:16px}
.choice input{accent-color:var(--accent-ink);width:18px;height:18px}
.choice label>span{display:block;line-height:1.35}
.choice label input{margin-top:3px;flex:0 0 auto}
.curex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.earlynote{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0}
.segs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px 7px 11px;font-size:15px;font-weight:500;cursor:pointer;min-height:44px}
.seg .ico{width:20px;height:20px;color:var(--accent-ink)}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.seg.on .ico{color:var(--on-accent)}
.subjs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.subj{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-height:44px}
.subj.on{border-color:var(--accent-ink);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.subj:disabled{opacity:.5;cursor:default}
.subj small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400}
.subj .ru{font-size:12px;font-weight:400}

/* ---------- workbook questions ---------- */
.card.school{display:flex;flex-direction:column;gap:8px}
.card.school .bar{height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.card.school .bar i{display:block;height:100%;background:var(--ok)}
.scgrp{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.scrow{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;cursor:pointer;min-height:50px}
.scrow .ck{flex:0 0 24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ok)}
.scrow.done{border-color:var(--ok);background:var(--ok-soft)}
.scrow.done .ck{border-color:var(--ok);background:var(--card)}
.scrow .nm{flex:1;display:flex;flex-direction:column;min-width:0}
.scrow .nm .ru{font-size:14px;color:var(--muted)}
.scrow .src{font-size:12px;color:var(--faint)}
.scb{display:inline-block;margin-top:4px;font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:5px;padding:1px 7px;width:fit-content}
.schead{border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}

/* ---------- today ---------- */
.hello{padding:2px 2px 0}
.hello .hi{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em;font-size:26px;line-height:1.2}
.hello .muted{font-size:15px}
.goal{display:flex;align-items:center;gap:14px}
.gtx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.gtx .muted{font-size:14px;line-height:1.35}
.ring{display:block;flex:0 0 auto}
.ring .rb{fill:none;stroke:var(--grid);stroke-width:3}
.ring .rf{fill:none;stroke:var(--accent-ink);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.ring .rf.full{stroke:var(--ok)}
.ring .rt{font-size:10px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-family:var(--f-display)}
.streak{display:flex;flex-direction:column;align-items:center;min-width:60px;color:var(--faint)}
.streak .ico{width:26px;height:26px;stroke-width:1.6}
.streak.on .ico{color:var(--c2)}
.streak b{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15;color:var(--ink);font-variant-numeric:lining-nums}
.streak span{font-size:11px;text-align:center;line-height:1.2}
.streak.big{min-width:64px}
.streak.big .ico{width:44px;height:44px}
/* the focus card: the one thing to do now */
.focus{display:flex;flex-direction:column;gap:14px;padding:18px 16px 16px;color:var(--focus-ink);background:var(--focus-bg);border-color:var(--focus-bg)}
.frow{display:flex;align-items:center;gap:14px}
.focus .gtx b{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.25}
.focus .muted{color:var(--focus-sub)}
.focus .ring .rb{stroke:var(--focus-line)}
.focus .ring .rf,.focus .ring .rf.full{stroke:var(--amber)}
.focus .ring .rt{fill:var(--focus-ink)}
.focus .streak{color:var(--focus-sub)}
.focus .streak b{color:var(--focus-ink)}
.focus .streak.on .ico{color:var(--amber)}
.focus .btn.big{background:var(--focus-btn);color:var(--focus-btn-ink);border-color:var(--focus-btn)}
.focus .btn.big .ico{fill:currentColor;stroke:none}
.focus .planex{background:var(--focus-line);color:var(--focus-ink)}
.fplan{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-top:1px solid var(--focus-line);background:none;border-radius:0;padding:12px 2px 0;font-size:15px;font-weight:500;color:var(--focus-ink);cursor:pointer;text-align:left;width:100%}
.pdots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pdots i{width:8px;height:8px;border-radius:50%;background:var(--focus-line);display:block}
.pdots i.on{background:var(--amber)}
.count{display:flex;align-items:center;gap:16px}
button.count{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.cbig{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:10px 8px 9px;border-radius:10px;background:var(--chip)}
.cbig .num{font-family:var(--f-display);font-weight:600;font-size:46px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums}
.cbig .num.now{font-size:25px;line-height:1.6}
.cbig .lab{font-size:11.5px;font-weight:500;color:var(--muted);text-align:center;line-height:1.2;margin-top:5px}
.ctx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ctx b{font-family:var(--f-display);font-weight:600;font-size:19px}
.ctx .muted,.count .ctx .muted{font-size:14px;line-height:1.35}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.count .bar>i{background:var(--accent-ink)}
.exrow{display:flex;gap:8px;overflow-x:auto;margin:-4px -16px 0;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.exrow::-webkit-scrollbar{display:none}
.exchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.exchip .ico{color:var(--accent-ink)}
.exchip span{display:flex;flex-direction:column;line-height:1.25}
.exchip b{font-size:15px}.exchip small{font-size:12px;color:var(--muted)}
.exchip.past{opacity:.5}
.cont{display:flex;align-items:center;gap:12px}
.cont .lt{flex:1;display:flex;flex-direction:column;min-width:0}
.cont .lt b{font-size:16.5px;line-height:1.3}
.cont .lt .muted{font-size:13px}
.rcard{display:flex;align-items:center;gap:12px}
.rcard .lt{flex:1;display:flex;flex-direction:column;min-width:0}
.rcard .lt b{font-family:var(--f-display);font-weight:600;font-size:18px}
.rcard .lt .muted{font-size:14px;line-height:1.35}
.rcard.late{border-color:var(--accent-ink);background:var(--accent-soft)}
.rcard.sent .lic{background:var(--ok-soft);color:var(--ok)}
.guide{border-color:var(--accent-ink);background:var(--accent-soft)}
.gsteps{margin:6px 0 8px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.planex{margin-top:8px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-weight:600}
.planwarn{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.4}
.pday{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.pd{display:flex;flex-direction:column;align-items:center;min-width:44px}
.pd b{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.05;font-variant-numeric:lining-nums}
.pd small{font-size:12px;color:var(--muted)}
.pb{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pi{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.35}
.pi .ico{width:19px;height:19px;color:var(--accent-ink);margin-top:1px}
.pi.ex{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:6px 10px;align-items:center;font-weight:600}

/* ---------- topics ---------- */
.scard{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;padding:14px}
.stile{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;color:var(--on-accent);background:var(--accent)}
.stile .ico{width:26px;height:26px;stroke-width:1.8}
.stile.big{width:54px;height:54px}
.stile.big .ico{width:28px;height:28px}
.sbody{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.snm{display:flex;flex-direction:column;line-height:1.2}
.snm b{font-family:var(--f-display);font-weight:600;font-size:20px}
.snm .ru{font-size:13px}
.sbody .bar>i,.prow .bar>i,.chcard .bar>i{background:var(--accent-ink)}
.sdate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:7px 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink)}
.sdate b{font-family:var(--f-display);font-size:23px;font-weight:600;line-height:1;font-variant-numeric:lining-nums}
.sdate small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
.hero{display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:14px}
.htx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.htx .ru{font-size:14px}
.hero .btn.primary .ico{width:20px;height:20px}

/* ---------- me / progress ---------- */
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px;text-align:center}
.pstats b{display:block;font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;color:var(--ink);font-variant-numeric:lining-nums}
.pstats span{font-size:13px;color:var(--muted);line-height:1.2;display:block}
.rview .pstats{grid-template-columns:repeat(3,minmax(0,1fr))}
.bplot{position:relative;height:104px;display:flex;align-items:flex-end;gap:4px}
.bcol{flex:1;height:100%;display:flex;align-items:flex-end}
.bcol i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--accent-soft);min-height:2px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bcol.ok i{background:var(--ok)}
.gline{position:absolute;left:0;right:0;border-top:1px dashed var(--faint);opacity:.8}
.blab{display:flex;gap:4px;margin:4px 0 6px}
.blab span{flex:1;text-align:center;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.blab span.now{color:var(--accent-ink);font-weight:600}
.mehero{display:flex;align-items:center;gap:14px}
.mehero .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mename{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15}
.mehero .muted{font-size:13px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.badge .bm{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--faint);margin-bottom:2px}
.badge .bm .ico{width:23px;height:23px}
.badge b{font-size:14px;line-height:1.25}
.badge small{font-size:12px;color:var(--muted);line-height:1.3}
.badge .bar{width:80%;height:4px;margin-top:4px}
.badge .bar i{background:var(--faint)}
.badge.got{border-color:var(--amber)}
.badge.got .bm{background:var(--warn-soft);color:var(--warn)}
.badge:not(.got){opacity:.82}
@media (max-width:370px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sharebox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.report{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--chip);border-radius:8px;padding:10px 12px;margin:0;max-height:240px;overflow:auto}
.rsec{font-size:15px;line-height:1.45;margin-top:6px}
.rsec .up{color:var(--ok);font-weight:600}.rsec .dn{color:var(--bad);font-weight:600}
.setl{display:flex;flex-direction:column;gap:16px}
.setr{display:flex;flex-direction:column;gap:6px}
.setr .meta{line-height:1.35}

/* ---------- sheets ---------- */
.sheetbg{position:fixed;inset:0;z-index:50;background:var(--veil);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadein .2s ease}
.sheet{background:var(--card);color:var(--ink);border-radius:16px;padding:20px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-up)}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px}
.sheet p{margin:0 0 4px}
.sheetbg.up{padding:0;align-items:flex-end}
.sheetbg.up .sheet{max-width:560px;border-radius:16px 16px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;animation:sheetup .24s ease-out}
.sheet.tall{gap:14px}
.sheet .gsteps{margin:0 0 6px;font-size:16.5px;line-height:1.45}
.shhead{display:flex;flex-direction:column}
.shhead h3{margin:0}
.chsec{display:flex;flex-direction:column;gap:6px;min-width:0}
.chsec p{margin:0}
.chl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink)}
details.chsec>summary{cursor:pointer;list-style-position:inside}

/* ---------- motion: short and quiet ---------- */
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vin>*{animation:vin .22s ease-out both}
.vin>*:nth-child(2){animation-delay:.03s}.vin>*:nth-child(3){animation-delay:.06s}.vin>*:nth-child(n+4){animation-delay:.09s}
.btn,.card,.tab,.lrow,.prow,.exchip,.opt,.skill,.scrow,.seg,.subj,.tgl,.uchip,.k{transition:background-color .15s,border-color .15s,opacity .15s}
.btn:active,button.card:active,.lrow:active,.prow:active,.exchip:active,.opt:active,.skill:active,.scrow:active,.seg:active,.tgl:active{opacity:.82}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fb.pop{animation:pop .2s ease-out}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.shake{animation:shake .28s ease}
@keyframes fadein{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(24px);opacity:0}}
@keyframes ringin{from{stroke-dasharray:0 200}}
.ring .rf{animation:ringin .8s cubic-bezier(.2,.8,.2,1)}
@keyframes barin{from{width:0}}
.bar>i{animation:barin .6s cubic-bezier(.2,.8,.2,1)}
.q .bar>i,.school .bar>i{animation:none}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
/* a calm note when something is completed */
.cele,.fly{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:var(--veil);padding:24px;animation:fadein .2s ease;transition:opacity .25s}
.cele.out,.fly.out{opacity:0}
.celec,.flyc{background:var(--card);color:var(--ink);border-radius:16px;padding:26px 22px;max-width:330px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow-up);animation:celein .26s ease-out}
.celec b,.flyc b{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.25}
.celec span:not(.celei),.flyc span:not(.plane):not(.tick){color:var(--muted);font-size:16px;line-height:1.4}
.celei,.tick{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);margin-bottom:6px}
.celei .ico,.tick .ico{width:30px;height:30px}
.tick{background:var(--ok-soft);color:var(--ok)}
.tick .ico{stroke-width:2.2}
@keyframes celein{from{transform:translateY(10px);opacity:0}}
.plane{width:64px;height:64px;display:grid;place-items:center;color:var(--accent-ink);animation:planefly 1.4s ease-in-out infinite}
.plane .ico{width:36px;height:36px}
@keyframes planefly{0%,100%{transform:translate(-8px,4px)}50%{transform:translate(8px,-4px)}}
/* opening screen */
#splash{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;align-content:center;gap:16px;transition:opacity .35s ease;overflow:hidden}
#splash .spl{width:92px;height:92px;animation:vin .4s ease-out both}
#splash svg{width:100%;height:100%;display:block}
.splname{font-family:var(--f-body);font-weight:600;font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:2px;animation:vin .4s ease-out .1s both}
#splash.out{opacity:0;pointer-events:none}
.spltxt{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;min-height:64px;text-align:center;padding:0 24px}
.spltxt.in{opacity:1;transform:none}
.spltxt b{font-family:var(--f-display);font-weight:600;font-size:27px;line-height:1.2}
.spltxt span{color:var(--muted);font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.vin>*,#splash .spl,.splname,.fb.pop,.shake,.ring .rf,.bar>i,.celec,.celei,.plane,.sheetbg.up .sheet{animation:none!important}}

/* ---------- small phones ---------- */
@media (max-width:370px){.goal{gap:10px}.goal .ring{width:60px;height:60px}.gtx b{font-size:16px;line-height:1.25}.gtx .muted{font-size:13px}.streak{min-width:50px}.cbig{min-width:78px}.cbig .num{font-size:40px}.scard{gap:12px;padding:12px}.stile{width:44px;height:44px}.focus{padding:16px 14px 14px}.focus .ring{width:72px;height:72px}.focus .gtx b{font-size:18px}.btn.big{min-height:52px;font-size:17px}.hello .hi{font-size:23px}.sdate{min-width:46px}}

/* ===================== Brevet additions ===================== */
body{font-size:19px}
.h2{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.2}
.frn{font-size:15px;color:var(--muted);font-style:italic}
.secsub{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted);margin-left:auto;text-align:right}
.mt{margin-top:14px}
.row.nowrap{flex-wrap:nowrap}.row.nowrap .inp{flex:1;min-width:0}
/* the French text and its Russian translation share one grid cell: switching never moves the page */
.bi{display:grid;min-width:0}
.bi>span{grid-area:1/1;min-width:0}
.bi>.l-ru{visibility:hidden}
html.tr .bi>.l-fr{visibility:hidden}
html.tr .bi>.l-ru{visibility:visible}
.appbar .tgl{height:40px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
/* question */
.q .instr{font-size:19px;line-height:1.5}
.qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.qname{display:flex;flex-direction:column;gap:1px;min-width:0}
.qname b{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);line-height:1.4}
.chip .ico{width:15px;height:15px;stroke-width:1.9}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.red{background:var(--warn-soft);color:var(--warn)}
.chip.src{background:var(--chip);color:var(--muted);font-weight:500}
.chip.lvl1{background:var(--ok-soft);color:var(--ok)}
.chip.lvl3{background:var(--chip);color:var(--muted)}
.dots i.x{background:var(--bad)}
.dots b{display:grid;place-items:center;color:var(--ok)}.dots b .ico{width:17px;height:17px;stroke-width:2.4}
.exnum{margin-right:8px;vertical-align:1px}
.instr .bi{display:inline-grid;vertical-align:top;width:calc(100% - 44px)}
.instr>.bi:first-child,.pctx>.bi{width:100%}
.flab{font-size:17px;color:var(--ink);display:block;margin-bottom:2px}
.opt .bi{flex:1}
.opt>span:not(.l){flex:1;min-width:0}
.qbtns .btn.big{flex:1 1 100%}
@media (min-width:700px){.qbtns .btn.big{flex:0 0 auto;min-width:220px}}
.hints{display:flex;flex-direction:column;gap:8px}
.solbox{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.solbox h3{margin:0}
.ansline{font-size:17px}
.sol .stp{font-size:17px;line-height:1.5}
.sol .mth{padding:2px 0;font-size:18px}
details.rv summary{color:var(--accent-ink);font-weight:600;font-size:16px;padding:4px 0}
details.rv .sol{margin-top:8px}
/* figures */
.figw{max-width:460px;width:100%}
.figw table.pblk{max-width:100%}
.fig{width:100%;height:auto;display:block;overflow:visible}
.fig text,.fig .ftx{font-family:var(--f-body);font-size:15px;fill:var(--ink)}
.fig .ftm{font-size:13px;fill:var(--muted)}
.fig .fl{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fig .fl2{fill:none;stroke:var(--faint);stroke-width:1.2}
.fig .fdash{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.fig .fhl{fill:none;stroke:var(--c2);stroke-width:3;stroke-linecap:round}
.fig .ffill{fill:var(--accent-ink);fill-opacity:.12;stroke:none}
.fig .fpt{fill:var(--ink);stroke:none}
.fig .fang{fill:none;stroke:var(--accent-ink);stroke-width:1.6}
.fig .fgrid{stroke:var(--grid);stroke-width:1;fill:none}
.fig .fax{stroke:var(--muted);stroke-width:1.5;fill:none}
.fig .fcurve{fill:none;stroke:var(--accent-ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.fig .fbar{fill:var(--accent-ink);fill-opacity:.78;stroke:none}
.fig .fc1{fill:#4C78A8}.fig .fc2{fill:#E3A94B}.fig .fc3{fill:#2F7D57}.fig .fc4{fill:#B4443C}.fig .fc5{fill:#8E6BBF}.fig .fc6{fill:#7B8290}
/* steps to put in order */
.ord{display:flex;flex-direction:column;gap:10px}
.ordsel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ordslot{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--faint);font-size:15px}
.ordpool{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ordit{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16.5px;cursor:pointer;min-height:48px}
.ordit .l{flex:0 0 26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:13.5px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.ordit.on{border-color:var(--accent-ink);background:var(--accent-soft)}
.ordit.right{border-color:var(--ok);background:var(--ok-soft)}.ordit.right .l{background:var(--ok)}
.ordit.wrong{border-color:var(--bad);background:var(--bad-soft)}.ordit.wrong .l{background:var(--bad)}
.ordit:disabled{cursor:default;opacity:1}
.ordok{margin:4px 0 0;padding-left:22px}
/* problem */
.pbhead{display:flex;flex-direction:column;gap:10px}
.pctx{font-size:18px;line-height:1.5}
.pq{border-left:3px solid var(--accent-soft)}
/* tests */
.exhead{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:6}
.exrowtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.exhead p{margin:6px 0 0;font-size:15px}
.tmr{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums lining-nums;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:4px 12px;flex:0 0 auto}
.tmr.low{color:var(--bad);background:var(--bad-soft)}
.exfoot{padding:10px 12px}
.exres{display:flex;flex-direction:column;gap:10px}
.scorebig{font-family:var(--f-display);font-weight:600;font-size:54px;line-height:1;font-variant-numeric:lining-nums}
.scorebig small{font-size:24px;color:var(--muted)}
.rvq.okq{border-left:3px solid var(--ok)}.rvq.badq{border-left:3px solid var(--bad)}
/* sign in */
html.nologin .tabbar{display:none}
html.nologin .page{padding-bottom:28px}
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 18px}
.login .logo{width:72px;height:72px}.login .logo svg{width:100%;height:100%;display:block}
.inp.pin{letter-spacing:.5em;font-size:24px;text-align:center;max-width:220px}
.pinbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pindots{display:flex;gap:16px;margin:6px 0 10px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-ink);display:block}
.pindots i.on{background:var(--accent-ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pk{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:28px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:manipulation}
.pk:active{background:var(--accent-soft)}
.warnc{border-color:var(--bad);background:var(--bad-soft)}.warnc p{margin:4px 0 0}
.rcard .lt b{font-size:17px}
a.card,a.lrow,a.skill,a.chcard,a.exchip,a.fplan{text-decoration:none;color:inherit}
a.fplan{color:var(--focus-ink)}
.skill .nm b{font-size:16.5px;font-weight:600;line-height:1.3}
.skill .nc{color:var(--warn);display:grid;place-items:center}.skill .nc .ico{width:18px;height:18px}
.lic.num{font-family:var(--f-display);font-size:15px}
.dico{display:flex;flex-direction:column;gap:0;padding:6px 16px}
.dw{display:flex;flex-direction:column;padding:10px 0;border-bottom:1px solid var(--line)}
.dw:last-child{border-bottom:0}
.dw b{font-size:17px}.dw span{font-size:16px}.dw small{font-size:14px;margin-top:2px}
textarea.code{font-family:var(--f-mono);font-size:13px;word-break:break-all}
.theory .frn{font-family:var(--f-body);font-weight:400;font-size:14px}
.theory .mth{font-size:18px;overflow-x:auto}
/* «Вышла новая версия» */
#updbar{position:fixed;left:50%;bottom:calc(16px + var(--tab-h) + var(--kb-h));transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-up);z-index:60}
#updbar span{flex:1;line-height:1.3;font-size:16px}
#updbar small{display:block;color:var(--muted);font-size:14px}
#updbar .x{border:0;background:transparent;color:var(--muted);font-size:20px;min-width:44px;min-height:44px;cursor:pointer}
.ansbox:not(.multi)>.part{border-left:0;padding-left:0}
.k.hide{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--muted)}.k.hide .ico{width:20px;height:20px}
/* readable small print: nothing under 12 px */
.tab{font-size:12px}
.streak span{font-size:12px}
.cbig .lab{font-size:12.5px}
.blab span{font-size:12px}
.sdate small{font-size:12px}
.lrow .lt .muted{font-size:15px;line-height:1.35}
.rcard .lt .muted{font-size:15px}
.cont .lt .muted{font-size:15px}
#app{display:flex;flex-direction:column;gap:12px;min-width:0}
.htx .muted{font-size:15px;line-height:1.4}
.hero .htx b.h2{display:block}
</style>
</head>

/* ===================== GENERATOR HELPERS ===================== */
function mkRng(seed) {
  let a = seed >>> 0;
  const f = function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  f.nz = (lo, hi) => { let v; do v = f.ri(lo, hi); while (v === 0); return v; };
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.sgn = () => (f() < 0.5 ? -1 : 1);
  f.sh = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

}

/* ===================== CONTENT API · Brevet =====================
   Everything the app teaches is declared with the functions in this file:
     chapter({...})   — a domain of the programme (Nombres et calculs, Géométrie…)
     topic({...})     — a trainer: one skill, endless generated questions (Partie 1 style)
     probleme({...})  — a Partie 2 exercise: a context and several questions «по мотивам» a real sujet
     fiche({...})     — a cheat sheet for a chapter (Russian, with the French words)
     gloss(fr, ru)    — an entry of the French–Russian maths dictionary

   Languages
     L(fr, ru) — a text of the question: French as on the exam, Russian behind the «Перевод» button.
     Hints, solution steps and fiches are Russian only (the interface language); French terms go in «…».
   Formulas inside texts
     $…$   — formula in input syntax: $3/4$, $x^2+1$, $√2$, $2*10^3$, $3.5$ (shown as 3,5), $a=b$.
     $$…$$ — raw TeX for the rare cases input syntax cannot express.
   Numbers in plain text: nf(3.5) → «3,5», nf(45000) → «45 000», eur(12.5) → «12,50 €».
*/
const CHAPTERS = [], TOPICS = [], PROBLEMS = [], FICHES = [], GLOSS = [];
const L = (fr, ru) => ({ fr, ru });

const bi = t => (t && typeof t === 'object' ? t : { fr: String(t), ru: String(t) });

/* chapter({ id: 'nc', ru: 'Числа и вычисления', fr: 'Nombres et calculs' }) */
function chapter(def) { CHAPTERS.push(def); return def; }

/* --- normalising what generators return --- */
function fixStep(s) {

  if (Array.isArray(s)) { const o = { ru: s[0] || '', m: s[1] }; if (s[2]) o.u = s[2]; return o; }
  if (s && s.t != null) { const o = { ru: s.t }; if (s.tex) o.tex = s.tex; if (s.svg) o.svg = s.svg; if (s.m) o.m = s.m; return o; }
  return s;
}
function fixSpec(sp) {
  if (!sp) return sp;
  if (sp.k === 'mcq') sp.opts = sp.opts.map(bi);
  if (sp.k === 'order') sp.items = sp.items.map(bi);
  if (sp.k === 'multi') sp.parts.forEach(p => { p.lab = p.lab == null ? null : bi(p.lab); fixSpec(p.spec); });
  return sp;
}
function fixQ(it) { it.q = bi(it.q); it.sol = (it.sol || []).map(fixStep); fixSpec(it.ans); return it; }

/* topic({ id: 'nc.frac-add', ch: 'nc', ru: 'Сложение дробей', fr: 'Additionner des fractions',
           lvl: 1 | 2 | 3,       — 1 база (пробелы 5e–4e), 2 уровень бревета, 3 сверх (сложнее экзамена)
           calc: false,          — false: без калькулятора (Partie 1), true: с калькулятором
           variants: 3,          — сколько типов заданий, gen получает vi = 0 … variants−1
           hints: ['…', '…'],    — 1–3 подсказки по-русски, от идеи к почти решению
           gen(r, vi) { return { q: L(fr, ru), m | tex | fig, ans, sol: [...] }; } }) */
function topic(def) {
  def.kind = 'topic'; def.hints = def.hints || []; def.lvl = def.lvl || 2; def.calc = !!def.calc;
  const g = def.gen;
  def.gen = function (r, vi) { const it = fixQ(g.call(def, r, vi)); if (it.calc == null) it.calc = def.calc; return it; };

/* probleme({ id: 'p2.salaires', ch: 'st', ru: 'Зарплаты в компании', fr: 'Salaires dans une entreprise',

              gen(r) { return { ctx: L(fr, ru), fig?, qs: [ { q: L(fr, ru), m?, tex?, fig?, ans, sol, pts?, red? }, … ] }; } })
   red: true marks a «rédaction» question (choose the justification / put the steps in order). */
function probleme(def) {
  def.kind = 'prob'; def.lvl = def.lvl || 2; def.calc = def.calc !== false;
  const g = def.gen;
  def.gen = function (r) {
    const p = g.call(def, r); p.ctx = p.ctx == null ? null : bi(p.ctx);
    p.qs = p.qs.map(q => { fixQ(q); if (q.calc == null) q.calc = def.calc; if (!q.pts) q.pts = 1; return q; });
    return p;
  };
  PROBLEMS.push(def); return def;
}

/* ===================== MATH IN TEXT: $…$ and $$…$$ → KaTeX ===================== */

/* KaTeX is the slowest part of drawing a screen: the same formula is rendered once and remembered */

function K(tx, display) {
  const key = (display ? 'D' : 'I') + tx; const hit = KCACHE.get(key); if (hit != null) return hit;
  let h; try { h = katex.renderToString(tx, { throwOnError: false, displayMode: !!display, strict: false }); } catch (e) { h = '<code>' + esc(tx) + '</code>'; }
  if (KCACHE.size > 4000) KCACHE.clear();
  KCACHE.set(key, h); return h;
}
const REL = { '≠': '\\ne ', '≤': '\\le ', '≥': '\\ge ', '<': '<', '>': '>', '→': '\\;\\to\\;', '=': '=', '⇔': '\\;\\Leftrightarrow\\;', '≈': '\\approx ', ';': ';\\;' };
/* formula in input syntax (may contain = < ≤ … and ; between several formulas) → TeX */
function mi(s, strict) {
  return String(s).split(/(≠|≤|≥|<|>|→|⇔|≈|=|;)/).map(p => {
    if (REL[p] != null) return REL[p];
    if (!p.trim()) return '';

const unEsc = x => x.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
/* text with formulas: $$…$$ is TeX, $…$ is input syntax */
function rt(s) {
  return esc(s).replace(/\$\$([^$]+)\$\$|\$([^$]+)\$/g, (m, t, x) => t != null ? K(unEsc(t)) : K(mi(unEsc(x)).replace(/\\dfrac/g, '\\frac')));
}
/* every formula of a text, as TeX — used by the automatic tests */
function texOfText(s) {
  const out = []; String(s).replace(/\$\$([^$]+)\$\$|\$([^$]+)\$/g, (m, t, x) => { out.push(t != null ? t : mi(x, true)); return m; }); return out;
}

    'Общий знаменатель — число, которое делится на оба знаменателя; удобнее всего наименьшее. Числитель и знаменатель умножаем на одно и то же число: дробь от этого не меняется, меняется только размер долей.',

  } });

/* ---------- numbers ---------- */
const paR = (v, k) => { const p = Math.pow(10, k || 0); return Math.round(v * p + (v >= 0 ? 1e-7 : -1e-7)) / p; };   /* round half up (2.45 → 2.5) */
const paK = (v, k) => paR(v, k).toFixed(k);                       /* key of a rounded answer: '0.85' */
const paF = (v, k) => nf(paR(v, k), k);                           /* rounded number in a text: '0,85' */
const paExact = (v, k) => { const x = v * Math.pow(10, k); return Math.abs(x - Math.round(x)) < 1e-6; };   /* v has at most k decimals */
const paEq = (v, k) => (paExact(v, k) ? '=' : '≈');                /* sign before a rounded result */
const paFz = (v, k) => (paExact(v, k) ? nf(+fx(v)) : paF(v, k));     /* rounded number for a text, without useless zeros */
const paKz = (v, k) => (paExact(v, k) ? fx(v) : paK(v, k));          /* the same in input syntax */
/* answer «rounded to k decimals»; an exact value needs no rounding instruction and may be written in any way */
function paNum(v, k, unit, frR, ruR) {
  const o = unit ? { unit } : {};
  if (paExact(v, k)) return { ans: N(fx(v), o), fr: '', ru: '', eq: '=' };
  return { ans: N(paK(v, k), Object.assign({ dp: k }, o)), fr: ' ' + frR, ru: ' ' + ruR, eq: '≈' };
}
/* Russian plural: paPl(5, ['пакетик', 'пакетика', 'пакетиков']) → 'пакетиков' */
const paPl = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b > 1 && b < 5 ? f[1] : f[2]; };
const paEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const paDec = n => pfStr(pfac(n));                                /* 140 → '2^2*5*7' */
/* the divisions that give the prime factors: '140=2*70;70=2*35;35=5*7' */
function paChain(n) { const out = []; let m = n, p = 2; while (m > 1) { if (m % p === 0) { if (m / p > 1) out.push(m + '=' + p + '*' + (m / p)); m /= p; } else p++; } return out.join(';'); }
/* prime factors common to all numbers with the smallest exponent (gcd), or all primes with the largest one (lcm) */
function paPf(ns, big) {
  const fs = ns.map(pfac), ps = [...new Set([].concat(...fs).map(f => f[0]))].sort((x, y) => x - y), out = [];
  ps.forEach(p => { const es = fs.map(f => (f.find(q => q[0] === p) || [p, 0])[1]); const e = big ? Math.max(...es) : Math.min(...es); if (e > 0) out.push([p, e]); });
  return out;
}
const paSec = s => { const m = Math.floor(s / 60), r = s % 60; return { fr: (m ? m + ' min' : '') + (m && r ? ' ' : '') + (r || !m ? r + ' s' : ''), ru: (m ? m + ' мин' : '') + (m && r ? ' ' : '') + (r || !m ? r + ' с' : '') }; };
const paHM = mn => { const h = Math.floor(mn / 60), m = mn % 60; return { fr: (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m || !h ? m + ' min' : ''), ru: (h ? h + ' ч' : '') + (h && m ? ' ' : '') + (m || !h ? m + ' мин' : '') }; };

/* ---------- French typography in plain text (not inside $…$): no line break before « ? ! : ; », between a number and its unit ---------- */
const PA_UNITS = 'm³/h|m³|m²|m/s|km/h|km|kWh|GWh|Wh|kW|kg|cm|mm|m|g|€|%|°C|h|min|s|м³/ч|м³|м²|м/с|км/ч|км|кВт·ч|ГВт·ч|Вт·ч|кВт|кг|см|м|г|ч|мин|с';
const PA_TYU = new RegExp('(\\d) (?=(?:' + PA_UNITS + ')(?![A-Za-zÀ-ÿА-Яа-яЁё0-9²³/·]))', 'g');
function paTy(s) {
  return String(s).split(/(\$\$[^$]*\$\$|\$[^$]*\$)/).map((p, i) => i % 2 ? p : p.replace(/ ([?!:;])/g, ' $1').replace(PA_TYU, '$1 ').replace(/(\d) (?=\d{3}(?!\d))/g, '$1 ')).join('');

const paTyT = o => (o && typeof o === 'object' && 'fr' in o ? { fr: paTy(o.fr), ru: paTy(o.ru) } : typeof o === 'string' ? paTy(o) : o);

function paTyS(s) { if (typeof s === 'string') return paTy(s); if (Array.isArray(s)) return [paTy(s[0] || '')].concat(s.slice(1)); return s; }
const paTbl = (rows, cls) => tbl(rows.map(r => r.map(c => paTy(c))), cls);

/* ---------- drawing ---------- */
const paC = v => (+v).toFixed(1);
function paArrow(x1, y1, x2, y2) {

}
/* a programme de calcul drawn as boxes: top → two columns (left, right) → merged steps */
function paFlow(top, left, right, merge, label) {
  const CW = 7.7, BH = 28, GAP = 18, cx = 170, cl = 86, cr = 254;
  const box = (x, y, t) => { const w = Math.min(334, t.length * CW + 22), x0 = paC(x - w / 2); return '<rect class="ffill" x="' + x0 + '" y="' + y + '" width="' + paC(w) + '" height="' + BH + '" rx="6"/><rect class="fl" x="' + x0 + '" y="' + y + '" width="' + paC(w) + '" height="' + BH + '" rx="6"/><text class="ftx" x="' + x + '" y="' + (y + 19) + '" text-anchor="middle">' + paEsc(t) + '</text>'; };
  const y0 = 2 + BH + GAP;
  const col = (c, items) => { let y = y0, o = ''; items.forEach((t, i) => { o += (i ? paArrow(c, y - GAP, c, y) : paArrow(cx, 2 + BH, c, y)) + box(c, y, t); y += BH + GAP; }); return { o, end: y - GAP }; };
  const A = col(cl, left), B = col(cr, right);
  let y = Math.max(A.end, B.end) + GAP, s = box(cx, 2, top) + A.o + B.o + paArrow(cl, A.end, cx - 14, y) + paArrow(cr, B.end, cx + 14, y);
  merge.forEach((t, i) => { if (i) s += paArrow(cx, y - GAP, cx, y); s += box(cx, y, t); y += BH + GAP; });
  return svgFig(340, y - GAP + 3, s, label);
}
/* a polyline cut where it leaves the top of the frame (the curves here never go down) */
function paClip(pts, ymax) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; if (y1 <= ymax + 1e-9) { out.push(pts[i]); continue; } out.push([x0 + (ymax - y0) / (y1 - y0) * (x1 - x0), ymax]); break; }
  return out;
}
/* a graph with a grid: o = { xmax, ymax, xg, yg (grid), xt, yt (numbers), xn, yn (axis names), curves: [{ pts, cls, dash, lab }], label } */
function paPlot(o) {
  const L0 = 42, T0 = 26, PW = 262, PH = 210, H = T0 + PH + 44;
  const X = x => L0 + x / o.xmax * PW, Y = y => T0 + PH - y / o.ymax * PH;

/* Scratch 3 blocks with French labels (the only figures with their own colours)
   a line: { k: 'hat' | 'c' | 'else' | 'end' | (stack block), d: depth, c: category, n: line number, p: parts }
   parts: 'text' · {flag:1} · {n:'100'} white input · {bl:'A'} blank to fill · {dd:'prix'} dropdown · {v:'prix'} variable · {sv:'réponse'} sensing reporter · {op:[…]} operator · {bo:[…]} condition */
const PA_SC = { ev: ['#FFBF00', '#CC9900'], ctl: ['#FFAB19', '#CF8B17'], sns: ['#5CB1D6', '#2E8EB8'], op: ['#59C059', '#389438'], vr: ['#FF8C1A', '#DB6E00'], lk: ['#9966FF', '#774DCB'] };
function paScratch(lines, label) {
  const FS = 13, CW = 7.35, IND = 16, LN = lines.some(l => l.n) ? 24 : 4;
  const tw = t => String(t).length * CW;
  const st = (f, s, x) => ' style="fill:' + f + ';stroke:' + (s || 'none') + ';stroke-width:1' + (x || '') + '"';
  const tx = (x, y, t, col, mid, wt) => '<text x="' + paC(x) + '" y="' + paC(y + 4.6) + '"' + (mid ? ' text-anchor="middle"' : '') + ' style="fill:' + col + ';stroke:none;font-size:' + FS + 'px;font-family:Helvetica,Arial,sans-serif;font-weight:' + (wt || 500) + '">' + paEsc(t) + '</text>';
  const pill = (x, cy, w, f, s, rx, x2) => '<rect x="' + paC(x) + '" y="' + paC(cy - 11) + '" width="' + paC(w) + '" height="22" rx="' + (rx == null ? 11 : rx) + '"' + st(f, s, x2) + '/>';
  const meas = p => {
    if (typeof p === 'string') return { w: tw(p), h: 16 };
    if (p.flag) return { w: 20, h: 18 };
    if (p.n != null) return { w: Math.max(26, tw(p.n) + 16), h: 22 };
    if (p.bl) return { w: 30, h: 22 };
    if (p.dd) return { w: tw(p.dd) + 26, h: 22 };
    if (p.v != null || p.sv != null) return { w: tw(p.v != null ? p.v : p.sv) + 18, h: 22 };
    const ps = (p.op || p.bo).map(meas);
    return { w: ps.reduce((s, q) => s + q.w, 0) + 5 * (ps.length - 1) + (p.bo ? 26 : 16), h: Math.max(...ps.map(q => q.h)) + 6 };
  };
  const draw = (p, x, cy, cat) => {
    const m = meas(p);
    if (typeof p === 'string') return tx(x, cy, p, '#FFFFFF');
    if (p.flag) return '<path d="M' + paC(x + 4) + ' ' + paC(cy + 8) + 'V' + paC(cy - 8) + '"' + st('none', '#45993D', ';stroke-width:2') + '/><path d="M' + paC(x + 4) + ' ' + paC(cy - 8) + 'q4 -3 8 0t8 0v8q-4 -3 -8 0t-8 0z"' + st('#4CBF56', '#45993D') + '/>';
    if (p.n != null) return pill(x, cy, m.w, '#FFFFFF', '#C8CCD6') + tx(x + m.w / 2, cy, p.n, '#575E75', true, 500);
    if (p.bl) return pill(x, cy, m.w, '#FFFFFF', '#575E75', 11, ';stroke-dasharray:3 2') + tx(x + m.w / 2, cy, p.bl, '#C0392B', true, 700);
    if (p.dd) return pill(x, cy, m.w, PA_SC[cat][1], PA_SC[cat][1], 4) + tx(x + 8, cy, p.dd + ' ▾', '#FFFFFF');
    if (p.v != null || p.sv != null) { const c = p.v != null ? PA_SC.vr : PA_SC.sns; return pill(x, cy, m.w, c[0], c[1]) + tx(x + m.w / 2, cy, p.v != null ? p.v : p.sv, '#FFFFFF', true); }
    const c = PA_SC.op, h = m.h;
    let s = p.bo ? '<polygon points="' + [[x, cy], [x + h / 2, cy - h / 2], [x + m.w - h / 2, cy - h / 2], [x + m.w, cy], [x + m.w - h / 2, cy + h / 2], [x + h / 2, cy + h / 2]].map(q => paC(q[0]) + ',' + paC(q[1])).join(' ') + '"' + st(c[0], c[1]) + '/>'
      : '<rect x="' + paC(x) + '" y="' + paC(cy - h / 2) + '" width="' + paC(m.w) + '" height="' + h + '" rx="' + (h / 2) + '"' + st(c[0], c[1]) + '/>';
    let xx = x + (p.bo ? 13 : 8);
    (p.op || p.bo).forEach(q => { s += draw(q, xx, cy, 'op'); xx += meas(q).w + 5; });
    return s;
  };
  const rows = lines.map(l => {
    const ps = (l.p || []).map(meas), cw = ps.reduce((s, q) => s + q.w, 0) + 6 * Math.max(0, ps.length - 1) + 18;
    return { l, w: l.k === 'end' ? 64 : Math.max(l.k === 'c' || l.k === 'else' ? 80 : 40, cw), h: l.k === 'end' ? 14 : Math.max(l.k === 'hat' ? 34 : 30, Math.max(16, ...ps.map(q => q.h)) + 10) };
  });
  let y = 4, arms = '', blocks = '';
  rows.forEach(rw => { rw.x = LN + rw.l.d * IND; rw.y = y; y += rw.h; });
  rows.forEach((rw, i) => {
    const col = PA_SC[rw.l.c], cy = rw.y + rw.h / 2;
    if (rw.l.k === 'c') { const e = rows.find((q, j) => j > i && q.l.k === 'end' && q.l.d === rw.l.d); arms += '<rect x="' + rw.x + '" y="' + rw.y + '" width="' + (IND + 2) + '" height="' + (e.y + e.h - rw.y) + '" rx="4"' + st(col[0], col[1]) + '/>'; }
    blocks += '<rect x="' + rw.x + '" y="' + rw.y + '" width="' + paC(rw.w) + '" height="' + rw.h + '" rx="' + (rw.l.k === 'hat' ? 12 : 4) + '"' + st(col[0], col[1]) + '/>';
    let xx = rw.x + 9;
    (rw.l.p || []).forEach(p => { blocks += draw(p, xx, cy, rw.l.c); xx += meas(p).w + 6; });
    if (rw.l.n) blocks += '<text x="' + (LN - 7) + '" y="' + paC(cy + 4.5) + '" text-anchor="end" style="fill:#8A8F99;stroke:none;font-size:12px;font-family:Helvetica,Arial,sans-serif">' + rw.l.n + '</text>';
  });
  return svgFig(Math.ceil(Math.max(336, ...rows.map(rw => rw.x + rw.w)) + 4), Math.ceil(y + 4), arms + blocks, label);   /* at least 340 wide: every program is drawn at the same scale */
}

/* ---------- p2.ia-energie : conversions d'unités, écriture scientifique, quotient de puissances de 10 ---------- */
paProb({ id: 'p2.ia-energie', ch: 'nc', lvl: 2, pts: 4,

        ans: N(stdStr(ia), { forms: ['std'], unit: 'Wh' }), sol: [

          'Стандартный вид («écriture scientifique») — это $a*10^n$, где $1≤a<10$; здесь $a=' + sa.a + '$.'] },
      { q: L('Convertir la consommation annuelle d\'un collège en wattheures, en écriture scientifique.', 'Переведи годовое потребление одного коллежа в ватт-часы, в стандартном виде.'),
        ans: N(stdStr(co), { forms: ['std'], unit: 'Wh' }), sol: [
          '1 кВт·ч = $10^3$ Вт·ч, поэтому умножаем на $10^3$.',
          ['', Y + '*10^3=' + sy.a + '*10^' + sy.e + '*10^3=' + stdStr(co)]] },
      { q: L('Pour savoir combien de collèges on pourrait alimenter pendant un an avec la consommation de l\'IA, quel calcul faut-il faire ? Choisir la proposition correctement justifiée.', 'Чтобы узнать, сколько коллежей можно целый год снабжать электричеством за счёт потребления ИИ, какое вычисление нужно сделать? Выбери вариант с верным обоснованием.'), red: true,
        ans: MQ(r, [
          L('Diviser la consommation de l\'IA par celle d\'un collège, toutes les deux en Wh : $' + stdStr(ia) + '÷(' + stdStr(co) + ')$.', 'Разделить потребление ИИ на потребление одного коллежа, оба в Вт·ч: $' + stdStr(ia) + '÷(' + stdStr(co) + ')$.'),
          L('Diviser ' + nf(X) + ' par ' + nf(Y) + ', car ce sont les deux consommations données dans l\'énoncé.', 'Разделить ' + nf(X) + ' на ' + nf(Y) + ', потому что это два потребления из условия.'),
          L('Multiplier la consommation de l\'IA par celle d\'un collège.', 'Умножить потребление ИИ на потребление коллежа.'),
          L('Diviser la consommation d\'un collège par celle de l\'IA.', 'Разделить потребление коллежа на потребление ИИ.')], 0), sol: [
          'Вопрос «сколько раз потребление одного коллежа помещается в потреблении ИИ» решается делением: потребление ИИ ÷ потребление коллежа.',
          'Но делить можно только величины в одних и тех же единицах: ' + nf(X) + ' — это ГВт·ч, а ' + nf(Y) + ' — кВт·ч, единица в миллион раз меньше. Поэтому сначала оба числа переводят в Вт·ч (вопросы 1 и 2).',

      { q: L('Combien de collèges pourrait-on alimenter pendant un an avec la consommation électrique annuelle de l\'IA ?', 'Сколько коллежей можно было бы снабжать электричеством в течение года за счёт годового потребления ИИ?'), ans: N(nC), sol: [
          ['Делим (оба числа в Вт·ч):', stdStr(ia) + '÷(' + stdStr(co) + ')'],
          ['Делим отдельно числа и отдельно степени десятки (показатели вычитаются):', '(' + sa.a + '÷' + sc.a + ')*10^(' + sa.e + '-' + sc.e + ')=' + fx(sa.a / sc.a) + '*10^' + (sa.e - sc.e) + '=' + nC],
          'Энергии ИИ хватило бы на год для ' + nf(nC) + ' коллежей.'] },
      { q: L('En France, il y a environ ' + NFc + ' collèges, qui consomment chacun en moyenne ' + nf(Y) + ' kWh par an. Pendant combien d\'années pourrait-on alimenter tous les collèges français avec la consommation annuelle de cette IA ? Arrondir à l\'unité.',
          'Во Франции около ' + NFc + ' коллежей, и каждый потребляет в среднем ' + nf(Y) + ' кВт·ч в год. Сколько лет можно было бы снабжать электричеством все коллежи Франции за счёт годового потребления этого ИИ? Округли до целых.'),
        ans: N(yr, { dp: 0 }), sol: [
          'Годовой энергии ИИ хватает на ' + nf(nC) + ' «коллежей-лет» (вопрос 4). Все коллежи Франции расходуют за год ' + NFc + ' таких «коллежей-лет» — значит, лет получится ' + nf(nC) + ' ÷ ' + NFc + '.',
          ['', nC + '÷' + NFc + (paExact(yrs, 2) ? '=' + fx(yrs) : '≈' + paK(yrs, 2))],
          (Number.isInteger(yrs) ? 'Получается ровно ' : 'Округляем до целых: примерно ') + yr + ' ' + paPl(yr, ['год', 'года', 'лет']) + '.'] }] };
  } });

/* ---------- p2.funiculaire : tarifs, pourcentage de réduction, vitesse moyenne, pente ---------- */
function paProfile(p) {
  const yA = 118, yB = Math.round(yA - 164 * p / 100), D = [16, 160], A = [154, yA], B = [318, yB], C = [318, yA];
  return svgFig(340, 176, '<polyline class="fl" points="' + [D, A, B].map(q => q.join(',')).join(' ') + '"/>' +
    '<line class="fdash" x1="154" y1="' + yA + '" x2="318" y2="' + yA + '"/><line class="fdash" x1="318" y1="' + yA + '" x2="318" y2="' + yB + '"/>' +
    '<polyline class="fang" points="306,' + yA + ' 306,' + (yA - 12) + ' 318,' + (yA - 12) + '"/>' + [D, A, B, C].map(q => '<circle class="fpt" cx="' + q[0] + '" cy="' + q[1] + '" r="3"/>').join('') +
    '<text class="ftx" x="10" y="150">D</text><text class="ftx" x="148" y="110" text-anchor="end">A</text><text class="ftx" x="326" y="' + (yB + 6) + '">B</text><text class="ftx" x="326" y="' + (yA + 14) + '">C</text>' +
    '<text class="ftm" x="236" y="' + Math.round((yA + yB) / 2 - 12) + '" text-anchor="end">pente ' + p + ' %</text>', 'Profil du trajet du funiculaire');
}
paProb({ id: 'p2.funiculaire', ch: 'pp', lvl: 2, pts: 5,
  ru: 'Фуникулёр', fr: 'Le funiculaire',

        ans: N(fx(T1), { unit: '€' }), sol: [
          'Нужен столбец «Tarif individuel» и строки «aller-retour» (туда и обратно), а не «aller simple».',
          ['Взрослые по ' + eur(ia) + ', дети по ' + eur(ie) + ':', nA + '*' + fx(ia) + '+' + nE + '*' + fx(ie) + '=' + fx(T1), '€']] },
      { q: L('Quel est le prix à payer par le groupe avec le tarif de groupe ?', 'Сколько заплатит группа по групповому тарифу?'), ans: N(fx(T2), { unit: '€' }), sol: [
          'В группе ' + (nA + nE) + ' человек — не меньше 20, значит, групповой тариф применим.',
          ['Взрослые по ' + eur(ga) + ', дети по ' + eur(ge) + ':', nA + '*' + fx(ga) + '+' + nE + '*' + fx(ge) + '=' + fx(T2), '€']] },
      { q: L('Quel calcul donne le pourcentage de réduction obtenu avec le tarif de groupe par rapport au tarif individuel ? Choisir la bonne justification.', 'Какое вычисление даёт процент скидки группового тарифа по сравнению с индивидуальным? Выбери верное обоснование.'), red: true,
        ans: MQ(r, [
          L('On divise l\'économie par le prix individuel, puis on multiplie par 100 : $(' + fx(T1) + '-' + fx(T2) + ')/' + fx(T1) + '*100$', 'Делим экономию на цену по индивидуальному тарифу и умножаем на 100: $(' + fx(T1) + '-' + fx(T2) + ')/' + fx(T1) + '*100$'),
          L('On divise l\'économie par le prix de groupe, puis on multiplie par 100 : $(' + fx(T1) + '-' + fx(T2) + ')/' + fx(T2) + '*100$', 'Делим экономию на групповую цену и умножаем на 100: $(' + fx(T1) + '-' + fx(T2) + ')/' + fx(T2) + '*100$'),
          L('On divise le prix de groupe par le prix individuel, puis on multiplie par 100 : $' + fx(T2) + '/' + fx(T1) + '*100$', 'Делим групповую цену на индивидуальную и умножаем на 100: $' + fx(T2) + '/' + fx(T1) + '*100$'),
          L('On calcule la différence entre les deux prix : $' + fx(T1) + '-' + fx(T2) + '$', 'Считаем разность двух цен: $' + fx(T1) + '-' + fx(T2) + '$')], 0), sol: [
          'Процент скидки показывает, какую часть исходной цены составляет экономия. Исходная цена — та, с которой сравнивают: здесь это индивидуальный тариф. Поэтому экономию делим именно на него.',

      { q: L('Calculer ce pourcentage de réduction.' + pn.fr, 'Вычисли этот процент скидки.' + pn.ru), ans: pn.ans, sol: [

        ans: N(paK(v, 2), { dp: 2, unit: 'm/s' }), sol: [

      { q: L('Sur la dernière partie du trajet, [AB], la pente est de ' + p + ' % et le dénivelé BC est de ' + h + ' m. Calculer la longueur horizontale AC. On rappelle : pente = dénivelé ÷ longueur horizontale.', 'На последнем участке пути, [AB], уклон равен ' + p + ' %, а перепад высот BC — ' + h + ' м. Найди горизонтальную длину AC. Напоминание: уклон = перепад высот ÷ горизонтальная длина.'),

/* ---------- p2.karting : vitesse moyenne, conversion m/s → km/h, PPCM de deux durées ---------- */
paProb({ id: 'p2.karting', ch: 'pp', lvl: 2, pts: 4,

          ['Средняя скорость любителя:', Lk + '÷' + T2 + paEq(v2, 2) + paKz(v2, 2), 'м/с'],
          ['Переводим в км/ч. За час (3600 с) он проехал бы в 3600 раз больше метров, а в километре 1000 м — значит, умножаем на 3600 и делим на 1000, то есть умножаем на 3,6:', Lk + '÷' + T2 + '*3.6' + paEq(kmh, 1) + paKz(kmh, 1), 'км/ч'],
          (ok ? tKm + ' < 60 — правило соблюдено.' : tKm + ' > 60 — правило нарушено.'),

      { q: L('Décomposer ' + T1 + ' et ' + T2 + ' en produits de facteurs premiers.', 'Разложи ' + T1 + ' и ' + T2 + ' на простые множители.'),
        ans: multi([T1 + ' =', XP(paDec(T1), { forms: ['primeFact'] })], [T2 + ' =', XP(paDec(T2), { forms: ['primeFact'] })]), sol: [

  } });

/* ---------- p2.promo-bonbons : comparer deux offres, réduction en pourcentage, augmentation ---------- */
paProb({ id: 'p2.promo-bonbons', ch: 'pp', lvl: 1, pts: 3,
  ru: 'Какой пакет выгоднее', fr: 'Deux formats de bonbons',
  src: 'Centres étrangers 2026 · exercice 2',
  gen(r) {
    const nm = r.pick(PRENOMS_F);
    const OF = r.pick([[4, 0.5, 'pour 3 sachets achetés, le quatrième est à moitié prix', 'при покупке 3 пакетов четвёртый — за полцены'], [4, 0, 'pour 3 sachets achetés, le quatrième est offert', 'при покупке 3 пакетов четвёртый — в подарок'], [3, 0.5, 'pour 2 sachets achetés, le troisième est à moitié prix', 'при покупке 2 пакетов третий — за полцены']]);
    let pA, pB, M, nA, nB, nRed, TA, TB;
    do { pA = r.ri(75, 84) / 10; pB = r.ri(40, 49) / 10; M = r.pick([1, 1, 2]); nA = 2 * M; nB = 4 * M; nRed = Math.floor(nB / OF[0]); TA = nA * pA; TB = (nB - nRed) * pB + nRed * pB * OF[1]; } while (Math.abs(TA - TB) < 0.2);
    const t = r.pick([4, 5, 6, 8, 10]), newA = pA * (1 + t / 100), mn = paNum(newA, 2, '€', 'Arrondir au centime.', 'Округли до цента.');
    const pct = (1 - OF[1]) / OF[0] * 100, pn = paNum(pct, 1, '%', 'Arrondir au dixième.', 'Округли до десятых.');
    const best = TA < TB ? 'A' : 'B', TX = Math.min(TA, TB), TY = Math.max(TA, TB);
    const fig = paTbl([['Format A', 'Format B'], ['Sachet de 500 g', 'Sachet de 250 g'], [eur(pA) + ' le sachet', eur(pB) + ' le sachet'], ['—', 'Offre : ' + OF[2] + '.']]);

    const payB = OF[1] ? (nB - nRed) + '*' + fx(pB) + '+' + nRed + '*' + fx(pB * OF[1]) + '=' + fx(TB) : (nB - nRed) + '*' + fx(pB) + '=' + fx(TB);
    return { ctx, fig, qs: [
      { q: L('Combien ' + nm + ' paiera-t-elle avec le format A ?', 'Сколько заплатит ' + nm + ', если возьмёт формат A?'), ans: N(fx(TA), { unit: '€' }), sol: [
          M + ' кг = ' + (1000 * M) + ' г — это ' + nP(nA) + ' по 500 г.',
          ['', nA + '*' + fx(pA) + '=' + fx(TA), '€']] },
      { q: L('Combien paiera-t-elle avec le format B, en profitant de l\'offre ?', 'Сколько она заплатит за формат B с учётом акции?'), ans: N(fx(TB), { unit: '€' }), sol: [
          (1000 * M) + ' г — это ' + nP(nB) + ' по 250 г.',
          'Акция: в каждой группе из ' + OF[0] + ' пакетов один ' + (OF[1] ? 'стоит половину цены (' + eur(pB * OF[1]) + ')' : 'бесплатный') + '. В ' + nB + ' пакетах ' + (nRed === 1 ? 'такая группа одна' : 'таких групп ' + nRed) + (nB % OF[0] ? ', и ещё ' + nP(nB % OF[0]) + ' — по полной цене.' : '.'),
          ['Платим:', payB, '€']] },
      { q: L('Quel format doit-elle choisir pour payer le moins cher possible ? Choisir la réponse correctement justifiée.', 'Какой формат ей выбрать, чтобы заплатить как можно меньше? Выбери ответ с верным обоснованием.'), red: true,
        ans: MQ(r, [
          L('Le format ' + best + ', car pour ' + M + ' kg on paie ' + eur(TX) + ' au lieu de ' + eur(TY) + '.', 'Формат ' + best + ', потому что за ' + M + ' кг платим ' + eur(TX) + ' вместо ' + eur(TY) + '.'),
          L('Le format B, car un sachet B coûte moins cher qu\'un sachet A : ' + eur(pB) + ' < ' + eur(pA) + '.', 'Формат B, потому что пакет B дешевле пакета A: ' + eur(pB) + ' < ' + eur(pA) + '.'),
          L('Le format ' + (TA < nB * pB ? 'A' : 'B') + ', car ' + nA + ' sachets A coûtent ' + eur(TA) + ' et ' + nB + ' sachets B coûtent ' + eur(nB * pB) + '.', 'Формат ' + (TA < nB * pB ? 'A' : 'B') + ', потому что ' + nP(nA) + ' A стоят ' + eur(TA) + ', а ' + nP(nB) + ' B — ' + eur(nB * pB) + '.'),
          L('Le format B, car avec l\'offre tous les sachets B sont moins chers.', 'Формат B, потому что по акции все пакеты B дешевле.')], 0), sol: [
          'Сравнивать нужно цену одного и того же количества конфет — ' + M + ' кг — с учётом акции: ' + eur(TA) + ' (формат A) и ' + eur(TB) + ' (формат B).',
          'Цены пакетов сравнивать нельзя: в пакете B вдвое меньше конфет. Без учёта акции цена формата B (' + eur(nB * pB) + ') неверна. А акция снижает цену только части пакетов, а не всех.'] },
      { q: L('Pour un lot de ' + OF[0] + ' sachets B, quel pourcentage de réduction cette offre représente-t-elle ?' + pn.fr, 'Какую скидку в процентах даёт акция на ' + nP(OF[0]) + ' B?' + pn.ru),
        ans: pn.ans, sol: [
          'Без акции ' + nP(OF[0]) + ' стоят ' + OF[0] + ' × (цена пакета). Акция экономит ' + (OF[1] ? 'половину цены одного пакета' : 'цену одного пакета целиком') + ' — это ' + (OF[1] ? '0,5' : '1') + ' цены пакета из ' + OF[0] + '.',
          ['Доля экономии в процентах:', (OF[1] ? '0.5' : '1') + '/' + OF[0] + '*100' + pn.eq + (pn.eq === '=' ? fx(pct) : paK(pct, 1)), '%'],
          'Частая ошибка — ответить «' + (OF[1] ? '50' : '100') + ' %»: скидка касается только одного пакета из ' + OF[0] + ', а не всей покупки.'] },
      { q: L('Le magasin augmente de ' + t + ' % le prix du sachet A. Quel est le nouveau prix d\'un sachet A ?' + mn.fr, 'Магазин повышает цену пакета A на ' + t + ' %. Какова новая цена пакета A?' + mn.ru),
        ans: mn.ans, sol: [
          'Увеличить на ' + t + ' % — значит к 100 % цены добавить ещё ' + t + ' %: получится ' + (100 + t) + ' % старой цены, то есть умножить на ' + nf(1 + t / 100) + '.',
          ['', fx(pA) + '*' + fx(1 + t / 100) + mn.eq + (mn.eq === '=' ? fx(newA) : paK(newA, 2)), '€']] }] };
  } });

/* ---------- p2.prog-ab : deux programmes de calcul, fonctions associées, antécédent, même résultat ---------- */
paProb({ id: 'p2.prog-ab', ch: 'cl', lvl: 2, pts: 4,
  ru: 'Две программы вычислений', fr: 'Deux programmes de calcul',
  src: 'Nouvelle-Calédonie 2025 · exercice 3',
  gen(r) {
    const nm = r.pick(PRENOMS_M);
    let a, b, c, d, k;
    do { a = r.ri(2, 7); b = r.ri(2, 5); k = r.pick([2, 3]); c = b + 1 + k; d = r.ri(2, 9); } while ((a * b + d) % k !== 0 || c > 9);
    const xs = (a * b + d) / k, b2 = c - 1, x0 = r.ri(1, 6), fA = b * (x0 + a), fB = c * x0 - d - x0;
    let x1; do x1 = r.ri(2, 9); while (x1 === x0);
    const y0 = b * x1 + a * b, fx_ = lin(b, a * b), gx = lin(b2, -d);
    const fig = paTbl([['Programme A', 'Programme B'], ['Choisir un nombre', 'Choisir un nombre'], ['Ajouter ' + a, 'Multiplier par ' + c], ['Multiplier par ' + b, 'Soustraire ' + d], ['', 'Soustraire le nombre de départ']]);
    const ctx = L('On considère les deux programmes de calcul ci-dessous.',
      'Даны две программы вычислений. Программа A: выбрать число; прибавить ' + a + '; умножить на ' + b + '. Программа B: выбрать число; умножить на ' + c + '; вычесть ' + d + '; вычесть исходное число.');
    return { ctx, fig, qs: [
      { q: L('On choisit ' + x0 + ' comme nombre de départ. Calculer le résultat obtenu avec chacun des deux programmes.', 'Исходное число — ' + x0 + '. Найди результат каждой из двух программ.'),
        ans: multi([L('Programme A :', 'Программа A:'), N(fA)], [L('Programme B :', 'Программа B:'), N(fB)]), sol: [
          ['Программа A:', x0 + '+' + a + '=' + (x0 + a) + ';' + (x0 + a) + '*' + b + '=' + fA],
          ['Программа B (в конце вычитаем исходное число ' + x0 + '):', x0 + '*' + c + '=' + (c * x0) + ';' + (c * x0) + '-' + d + '=' + (c * x0 - d) + ';' + (c * x0 - d) + '-' + x0 + '=' + fB]] },
      { q: L('Soit $f$ la fonction associée au programme A : au nombre choisi $x$, elle fait correspondre le résultat $f(x)$. Exprimer $f(x)$ en fonction de $x$, sous forme développée et réduite.', 'Пусть $f$ — функция программы A: выбранному числу $x$ она сопоставляет результат $f(x)$. Запиши $f(x)$ через $x$ в раскрытом и упрощённом виде.'),
        ans: XP(fx_, { forms: ['expanded'] }), sol: [
          ['Повторяем шаги программы с буквой $x$: прибавить ' + a + ', затем умножить на ' + b + ' — весь результат, поэтому скобки:', 'f(x)=' + b + '(x+' + a + ')'],
          ['Раскрываем скобки: умножаем ' + b + ' и на $x$, и на ' + a + ' (распределительный закон):', 'f(x)=' + fx_],
          'Проверка с числом ' + x0 + ': ' + b + ' × ' + x0 + ' + ' + (a * b) + ' = ' + fA + ' — как в вопросе 1.'] },
      { q: L('Calculer l\'antécédent de ' + y0 + ' par la fonction $f$.', 'Найди прообраз числа ' + y0 + ' при функции $f$.'), ans: N(x1), sol: [
          'Прообраз («antécédent») числа ' + y0 + ' — это число $x$, для которого $f(x)=' + y0 + '$. Решаем уравнение:',
          ['', fx_ + '=' + y0],
          ['Вычитаем ' + (a * b) + ' из обеих частей, затем делим обе части на ' + b + ':', b + 'x=' + (y0 - a * b) + ';x=' + x1],
          'Проверка: ' + b + ' × ' + x1 + ' + ' + (a * b) + ' = ' + y0 + '.'] },
      { q: L('Soit $g$ la fonction associée au programme B. Exprimer $g(x)$ en fonction de $x$, sous forme développée et réduite.', 'Пусть $g$ — функция программы B. Запиши $g(x)$ через $x$ в раскрытом и упрощённом виде.'),
        ans: XP(gx, { forms: ['expanded'] }), sol: [
          ['Шаги программы B с буквой $x$: умножить на ' + c + ', вычесть ' + d + ', вычесть исходное число $x$:', 'g(x)=' + c + 'x-' + d + '-x'],
          ['Приводим подобные: ' + c + 'x − x = ' + b2 + 'x (было ' + c + ' «иксов», один убрали):', 'g(x)=' + gx]] },
      { q: L(nm + ' a choisi un nombre. Il l\'a testé avec les deux programmes et a trouvé le même résultat. Remettre dans l\'ordre les étapes qui permettent de trouver ce nombre.', nm + ' выбрал число, проверил его в обеих программах и получил одинаковый результат. Расставь по порядку шаги, которые позволяют найти это число.'), red: true,
        ans: ORD(r, [
          L('On cherche $x$ tel que $f(x)=g(x)$, c\'est-à-dire $' + fx_ + '=' + gx + '$.', 'Ищем $x$, при котором $f(x)=g(x)$, то есть $' + fx_ + '=' + gx + '$.'),
          L('On soustrait $' + b + 'x$ aux deux membres : $' + (a * b) + '=' + lin(k, -d) + '$.', 'Вычитаем $' + b + 'x$ из обеих частей: $' + (a * b) + '=' + lin(k, -d) + '$.'),
          L('On ajoute ' + d + ' aux deux membres : $' + (a * b + d) + '=' + k + 'x$.', 'Прибавляем ' + d + ' к обеим частям: $' + (a * b + d) + '=' + k + 'x$.'),
          L('On divise les deux membres par ' + k + ' : $x=' + xs + '$.', 'Делим обе части на ' + k + ': $x=' + xs + '$.')]),
        sol: ['Сначала записываем уравнение, которое переводит условие «одинаковый результат». Потом собираем $x$ в одной части (вычитаем $' + b + 'x$ из обеих частей — от этого равенство не нарушается), переносим числа в другую часть тем же приёмом и в конце делим на коэффициент при $x$.'] },
      { q: L('Quel nombre ' + nm + ' a-t-il choisi ?', 'Какое число выбрал ' + nm + '?'), ans: N(xs), sol: [
          ['Решение уравнения из вопроса 5:', fx_ + '=' + gx + ';x=' + xs],
          ['Проверка — обе программы дают одно и то же:', 'f(' + xs + ')=' + (b * xs + a * b) + ';g(' + xs + ')=' + (b2 * xs - d)]] }] };
  } });

/* ---------- p2.prog-identite : programme (x+a)(x−a)+b, contre-exemple, identité, équation x² = k ---------- */
paProb({ id: 'p2.prog-identite', ch: 'cl', lvl: 2, pts: 4,
  ru: 'Программа и её секрет', fr: 'Un programme de calcul surprenant',
  src: 'Métropole 2020 · exercice 2',
  gen(r) {
    const a = r.ri(3, 9), c = r.ri(1, 6), b = a * a + c, k = r.ri(3, 10), s = r.ri(2, 6), R = s * s + c;
    const fig = paTbl([['Programme de calcul'], ['Choisir un nombre.'], ['Ajouter ' + a + ' à ce nombre.'], ['Soustraire ' + a + ' au nombre choisi au départ.'], ['Multiplier les deux résultats précédents.'], ['Ajouter ' + b + '.']]);
    const ctx = L('On considère le programme de calcul suivant.',
      'Дана программа вычислений: выбрать число; прибавить к нему ' + a + '; вычесть ' + a + ' из исходного числа; перемножить два полученных результата; прибавить ' + b + '.');
    const run = x => [x + '+' + a + '=' + (x + a), x + '-' + a + '=' + (x - a), np(x + a) + '*' + np(x - a) + '=' + ((x + a) * (x - a)), np((x + a) * (x - a)) + '+' + b + '=' + ((x + a) * (x - a) + b)].join(';');

/* ---------- p2.prime-course : mise en équation d'un partage, résolution, vérification ---------- */
paProb({ id: 'p2.prime-course', ch: 'cl', lvl: 1, pts: 3,

  gen(r) {

    const P = 3 * x + d1 - d3, e = d1 - d3, t = x + r.pick([-20, -10, 10, 20]), Pt = 3 * t + e;
    const ctx = L('Lors de la fête d\'un village, une course cycliste est organisée. Les trois premiers coureurs se partagent une prime totale de ' + P + ' euros : le premier reçoit ' + d1 + ' euros de plus que le deuxième, et le troisième reçoit ' + d3 + ' euros de moins que le deuxième.',
      'На деревенском празднике устроили велогонку. Три первых гонщика делят призовой фонд ' + P + ' евро: первый получает на ' + d1 + ' евро больше второго, а третий — на ' + d3 + ' евро меньше второго.');
    const eq = 'x+(x+' + d1 + ')+(x-' + d3 + ')=' + P, red1 = '3x' + (e > 0 ? '+' : '') + e + '=' + P;
    return { ctx, qs: [
      { q: L('Si le deuxième recevait ' + t + ' euros, quelle serait la somme des trois primes ?', 'Если бы второй получил ' + t + ' евро, какой была бы сумма трёх призов?'), ans: N(Pt, { unit: '€' }), sol: [
          ['Первый получил бы ' + t + ' + ' + d1 + ', третий ' + t + ' − ' + d3 + ':', t + '+' + (t + d1) + '+' + (t - d3) + '=' + Pt, '€'],
          'Это ' + (Pt < P ? 'меньше' : 'больше') + ', чем ' + P + ' €, — значит, второй получает не ' + t + ' €, а ' + (Pt < P ? 'больше' : 'меньше') + '. Подбирать дальше долго, поэтому составим уравнение.'] },
      { q: L('On note $x$ la prime du deuxième coureur, en euros. Quelle équation traduit le problème ?', 'Обозначим приз второго гонщика $x$ (в евро). Какое уравнение описывает задачу?'), red: true,
        ans: MQ(r, ['$' + eq + '$', '$x+(x-' + d1 + ')+(x+' + d3 + ')=' + P + '$', '$(x+' + d1 + ')+(x-' + d3 + ')=' + P + '$', '$3x=' + P + '$'], 0), sol: [
          'Первый получает на ' + d1 + ' больше второго: $x+' + d1 + '$. Третий — на ' + d3 + ' меньше: $x-' + d3 + '$. Сумма всех трёх призов (включая приз самого второго, $x$) равна ' + P + '.',
          'Ошибки: перепутать «больше» и «меньше»; забыть приз второго гонщика; разделить фонд поровну ($3x$) — но призы разные.'] },
      { q: L('Résoudre cette équation. Quelle est la prime du deuxième coureur ?', 'Реши это уравнение. Какой приз у второго гонщика?'), ans: N(x, { unit: '€' }), sol: [
          ['Раскрываем скобки и приводим подобные (три «икса» и числа):', eq + ';' + red1],
          [(e > 0 ? 'Вычитаем ' + e + ' из обеих частей' : 'Прибавляем ' + (-e) + ' к обеим частям') + ', затем делим на 3:', '3x=' + (P - e) + ';x=' + x]] },
      { q: L('Quelles sont les primes du premier et du troisième coureur ?', 'Какие призы у первого и у третьего гонщика?'),
        ans: multi([L('premier :', 'первый:'), N(x + d1, { unit: '€' })], [L('troisième :', 'третий:'), N(x - d3, { unit: '€' })]), sol: [
          ['', x + '+' + d1 + '=' + (x + d1) + ';' + x + '-' + d3 + '=' + (x - d3)],
          ['Проверка — сумма равна фонду:', (x + d1) + '+' + x + '+' + (x - d3) + '=' + P]] },
      { q: L('Remettre dans l\'ordre les étapes de la résolution de l\'équation.', 'Расставь по порядку шаги решения уравнения.'), red: true,
        ans: ORD(r, [
          L('On réduit le membre de gauche : $' + red1 + '$.', 'Упрощаем левую часть: $' + red1 + '$.'),
          L((e > 0 ? 'On soustrait ' + e + ' aux deux membres' : 'On ajoute ' + (-e) + ' aux deux membres') + ' : $3x=' + (P - e) + '$.', (e > 0 ? 'Вычитаем ' + e + ' из обеих частей' : 'Прибавляем ' + (-e) + ' к обеим частям') + ': $3x=' + (P - e) + '$.'),
          L('On divise les deux membres par 3 : $x=' + x + '$.', 'Делим обе части на 3: $x=' + x + '$.'),
          L('On vérifie : ' + (x + d1) + ' + ' + x + ' + ' + (x - d3) + ' = ' + P + '.', 'Проверяем: ' + (x + d1) + ' + ' + x + ' + ' + (x - d3) + ' = ' + P + '.')]),
        sol: ['Сначала упрощаем, потом «освобождаем» $3x$ от числа рядом с ним (одно и то же действие с обеими частями сохраняет равенство), потом делим на 3. Проверка — в самом конце, когда ответ уже найден.'] }] };
